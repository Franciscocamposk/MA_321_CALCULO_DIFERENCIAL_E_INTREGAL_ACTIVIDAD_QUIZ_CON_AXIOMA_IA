    else if (cfg.practicaPrevia && !previaHecha()) seleccionarModo('previa');
    actualizarModoInicio();
    mostrarPantalla('pantalla-inicio');
  }

  var CLAVE_PREVIA = 'quizMA321_previaHecha';

  function previaHecha() {
    try { return localStorage.getItem(CLAVE_PREVIA) === '1'; } catch (e) { return false; }
  }

  function marcarPreviaHecha() {
    try { localStorage.setItem(CLAVE_PREVIA, '1'); } catch (e) { /* almacenamiento no disponible */ }
  }

  function modoDisponible(modo) {
    var cfg = estado.config;
    if (!cfg) return modo === 'evaluado';
    if (modo === 'practica') return !!cfg.permitirPractica;
    if (modo === 'previa') return !!cfg.practicaPrevia;
    if (modo === 'axioma') return !!cfg.practicaIA;
    return true;
  }

  function modoSeleccionado() {
    var marcado = document.querySelector('input[name="modo"]:checked');
    return marcado && modoDisponible(marcado.value) ? marcado.value : 'evaluado';
  }

  function seleccionarModo(modo) {
    var radio = document.querySelector('input[name="modo"][value="' + modo + '"]');
    if (radio) radio.checked = true;
  }

  /** Ajusta el aviso y el botón de inicio según el modo elegido. */
  function actualizarModoInicio() {
    var cfg = estado.config;
    if (!cfg) return;
    var modo = modoSeleccionado();
    var practica = modo !== 'evaluado';
    var previa = modo === 'previa';
    var axioma = modo === 'axioma';
    var aviso = $('inicio-ventana');
    var etiquetas = document.querySelectorAll('.modo-opcion');
    for (var i = 0; i < etiquetas.length; i++) {
      etiquetas[i].classList.toggle('seleccionada', etiquetas[i].querySelector('input').checked);
    }

    aviso.className = 'alerta oculto';
    if (axioma) {
      aviso.textContent = 'Práctica con Axioma IA: ' + cfg.ejerciciosPracticaIA + ' preguntas con la misma temática del quiz (integrales, áreas entre curvas, etc.), creadas por la IA. Mismo formato que el quiz: opciones, verificar, pistas y solución. Al terminar te enviamos todo a tu correo en PDF.';
      aviso.className = 'alerta alerta-info';
    } else if (previa) {
      aviso.textContent = 'Práctica previa: ejercicios distintos a los del quiz para calentar. Verás la solución paso a paso de cada uno y, al terminar, podrás iniciar el quiz.';
      aviso.className = 'alerta alerta-info';
    } else if (practica) {
      aviso.textContent = 'Modo práctica: tus resultados no cuentan para la nota y verás la solución de cada ejercicio.';
      aviso.className = 'alerta alerta-info';
    }

    $('btn-iniciar').disabled = false;
    $('campo-codigo-grupo').classList.toggle('oculto', practica || !cfg.requiereCodigo);
    $('btn-iniciar').textContent = axioma ? 'Iniciar práctica con Axioma IA'
      : (previa ? 'Iniciar práctica previa' : (practica ? 'Iniciar práctica' : 'Iniciar quiz'));
    if (axioma) {
      $('chip-preguntas').textContent = cfg.ejerciciosPracticaIA + ' preguntas';
    } else if (previa) {
      $('chip-preguntas').textContent = cfg.totalPrevia + ' ejercicios';
    } else {
      $('chip-preguntas').textContent = cfg.preguntasReserva
        ? cfg.totalPreguntas + ' + ' + cfg.preguntasReserva + ' opcionales'
        : cfg.totalPreguntas + ' preguntas';
    }
    $('chip-tiempo').textContent = (axioma ? cfg.minutosPracticaIA : (previa ? cfg.minutosPrevia : cfg.tiempoMinutos)) + ' minutos';
    $('chip-puntaje').textContent = previa || axioma ? 'No cuenta para la nota' : cfg.puntajeTotal + ' puntos (' + cfg.valorPregunta + ' c/u)';
    $('chip-intentos').textContent = axioma ? 'Repetible, con otras preguntas'
      : (previa ? 'Repetible, con otros números' : (cfg.variosIntentos ? 'Varios intentos' : '1 intento'));
    $('instr-final').textContent = axioma
      ? 'Al verificar verás si acertaste y la solución paso a paso. Al terminar recibirás en tu correo un PDF con las preguntas y sus soluciones.'
      : practica
      ? 'Al finalizar verás tu puntaje, la respuesta correcta y la solución paso a paso de cada pregunta.'
      : (cfg.mostrarSolucion
        ? 'Al verificar o finalizar verás si acertaste, la respuesta correcta y la solución paso a paso. También recibirás todo en tu correo, con un PDF.'
        : 'Al finalizar verás tu nota y retroalimentación por pregunta, pero no la clave de respuestas.');
  }

  // =====================================================================
  //  PANTALLA DE INICIO
  // =====================================================================
  function marcarError(campo, mensaje) {
    $('campo-' + campo).classList.add('invalido');
    $('error-' + campo).textContent = mensaje;
  }

  function limpiarError(campo) {
    $('campo-' + campo).classList.remove('invalido');
    $('error-' + campo).textContent = '';
    $('inicio-error').classList.add('oculto');
  }

  /** Validación visual (el servidor vuelve a validar todo). */
  function validarFormulario() {
    if (!estado.config) {
      mostrarToast('La configuración del quiz no se cargó. Recarga la página.', 4000);
      return false;
    }
    var valido = true;
    var nombre = $('campo-nombre').value.trim();
    var carne = $('campo-carne').value.replace(/\s+/g, '');
    var grupo = $('campo-grupo').value.trim();
    var correo = $('campo-correo').value.trim().toLowerCase();
    var dominio = estado.config.dominioCorreo.replace(/\./g, '\\.');
    var soloUcr = estado.config.soloCorreoUcr !== false;
    var patronCorreo = soloUcr
      ? new RegExp('^[a-z0-9._%+\\-]+@' + dominio + '$')
      : /^[a-z0-9._%+\-]+@[a-z0-9\-]+(\.[a-z0-9\-]+)*\.[a-z]{2,}$/;

    ['nombre', 'correo', 'carne', 'grupo', 'codigo'].forEach(limpiarError);

    if (codigoVisible() && !$('campo-codigo').value.trim()) {
      marcarError('codigo', 'Escribe el código de acceso que te dio tu docente.'); valido = false;
    }
    if (estado.config.correoObligatorio && !correo) {
      marcarError('correo', 'El correo es obligatorio.'); valido = false;
    } else if (correo && !patronCorreo.test(correo)) {
      marcarError('correo', soloUcr ? 'Usa tu correo institucional (@' + estado.config.dominioCorreo + ').'
        : 'Escribe un correo válido.'); valido = false;
    }

    if (!nombre) {
      marcarError('nombre', 'Escribe tu nombre completo.'); valido = false;
    } else if (nombre.length < 5 || !/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .\-]+$/.test(nombre)) {
      marcarError('nombre', 'Usa solo letras y escribe tu nombre completo.'); valido = false;
    }
    if (!carne) {
      marcarError('carne', 'El carné es obligatorio.'); valido = false;
    } else if (!/^[A-Za-z0-9\-]{3,20}$/.test(carne)) {
      marcarError('carne', 'Solo letras, números y guiones (3 a 20 caracteres).'); valido = false;
    }
    if (estado.config.grupoObligatorio && !grupo) {
      marcarError('grupo', 'El grupo es obligatorio.'); valido = false;
    } else if (grupo && !/^[A-Za-z0-9ÁÉÍÓÚÑáéíóúñ .\-_]+$/.test(grupo)) {
      marcarError('grupo', 'El grupo contiene caracteres no permitidos.'); valido = false;
    }
    return valido;
  }

  function codigoVisible() {
    return !$('campo-codigo-grupo').classList.contains('oculto');
  }

  /** Segundo paso del inicio: el estudiante revisa sus datos antes de que empiece a correr el tiempo. */
  function confirmarDatosInicio() {
    if (!validarFormulario()) return;
    var modo = modoSeleccionado();
    var cfg = estado.config || {};
    if (modo === 'evaluado' && cfg.practicaPrevia && !previaHecha() && !estado.previaOfrecida) {
      abrirModal('Antes de empezar el quiz',
        'Te recomendamos hacer primero la práctica previa: ' + cfg.totalPrevia + ' ejercicios distintos a los del quiz (' +
        cfg.minutosPrevia + ' min), con la solución paso a paso de cada uno. No cuenta para la nota ni gasta tu intento.\n\n' +
        'Al terminarla volverás aquí para iniciar el quiz evaluado.',
        'Hacer la práctica previa', function () {
          seleccionarModo('previa');
          actualizarModoInicio();
          confirmarDatosInicio();
        }, 'Ir directo al quiz', function () {
          estado.previaOfrecida = true;
          confirmarDatosInicio();
        });
      return;
    }
    var practica = modo !== 'evaluado';
    var lineas = [
      'Nombre: ' + $('campo-nombre').value.trim(),
      'Carné: ' + $('campo-carne').value.replace(/\s+/g, '')
    ];
    if ($('campo-grupo').value.trim()) lineas.push('Grupo: ' + $('campo-grupo').value.trim());
    if ($('campo-correo').value.trim()) lineas.push('Correo: ' + $('campo-correo').value.trim());
    if (modo === 'axioma') {
      if (!$('campo-correo').value.trim()) {
        marcarError('correo', 'Escribe tu correo para recibir la práctica con las soluciones.');
        return;
      }
      lineas.push('Modo: Práctica con Axioma IA (no cuenta para la nota)');
      abrirModal('Confirma tus datos', lineas.join('\n') + '\n\nAl terminar te enviaremos las preguntas y sus soluciones a este correo.',
        'Continuar', function () { mostrarFraseInicio('Iniciar práctica con Axioma IA'); }, 'Corregir datos');
      return;
    }
    lineas.push('Modo: ' + (modo === 'previa' ? 'Práctica previa (no cuenta para la nota)'
      : (practica ? 'Práctica (no cuenta para la nota)' : 'Quiz evaluado')));
    var boton = modo === 'previa' ? 'Iniciar práctica previa' : (practica ? 'Iniciar práctica' : 'Iniciar quiz');
    abrirModal('Confirma tus datos',
      lineas.join('\n') + '\n\n' + (practica ? 'Al presionar “' + boton + '” comenzará el tiempo.'
        : 'Al presionar “Iniciar quiz” comenzará a correr el tiempo. Revisa que tus datos estén bien: así aparecerán en tu comprobante.'),
      'Continuar', function () { mostrarFraseInicio(boton); }, 'Corregir datos');
  }

  /** Frase de ánimo personal antes de la primera pregunta; el tiempo aún no corre. */
  function mostrarFraseInicio(textoBoton) {
    var listo = false;
    var abrir = function (frase) {
      if (listo) return;
      listo = true;
      ocultarCarga();
      abrirModal('Un mensaje para ti', frase, textoBoton || 'Iniciar quiz', solicitarInicio, 'Corregir datos');
      $('modal-texto').className = 'modal-frase';
    };
    var nombre = $('campo-nombre').value.trim().split(/\s+/)[0] || '';
    var respaldo = (nombre ? nombre + ', r' : 'R') + 'espira hondo: llegaste hasta aquí con tu esfuerzo. Confía en ti y avanza con calma.';
    mostrarCarga('Preparando un mensaje para ti…');
    setTimeout(function () { abrir(respaldo); }, 3500);
    google.script.run
      .withSuccessHandler(function (res) { abrir(res && res.ok && res.frase ? res.frase : respaldo); })
      .withFailureHandler(function () { abrir(respaldo); })
      .obtenerFraseInicio({ nombre: $('campo-nombre').value });
  }

  function solicitarInicio() {
    if (!validarFormulario()) return;
    var boton = $('btn-iniciar');
    boton.disabled = true;
    var cfg = estado.config;
    // La pantalla completa solo se puede pedir dentro del clic del estudiante, antes de llamar al servidor.
    var pedirPantalla = cfg.controlVentana && cfg.pantallaCompleta && !esDispositivoTactil();
    estado.pantallaCompletaLograda = false;
    if (pedirPantalla) intentarPantallaCompleta();
    mostrarCarga(modoSeleccionado() === 'axioma'
      ? 'Axioma IA está preparando tu práctica… Si tiene que crear y revisar preguntas nuevas, puede tardar hasta 3 minutos; no cierres esta página.'
      : 'Preparando tu quiz…');

    google.script.run
      .withSuccessHandler(function (res) {
        ocultarCarga();
        boton.disabled = false;
        if (!res || !res.ok) {
          if (pedirPantalla) salirPantallaCompleta();
          if (res && res.campo) marcarError(res.campo, res.mensaje);
          var error = $('inicio-error');
          error.textContent = (res && res.mensaje) || 'No fue posible iniciar el quiz.';
          error.classList.remove('oculto');
          return;
        }
        comenzarQuiz(res);
      })
      .withFailureHandler(function () {
        ocultarCarga();
        boton.disabled = false;
        if (pedirPantalla) salirPantallaCompleta();
        var error = $('inicio-error');
        error.textContent = 'Error de conexión. Verifica tu internet e intenta de nuevo.';
        error.classList.remove('oculto');
      })
      .iniciarQuiz({
        nombre: $('campo-nombre').value,
        correo: $('campo-correo').value,
        carne: $('campo-carne').value,
        grupo: $('campo-grupo').value,
        codigo: codigoVisible() ? $('campo-codigo').value : '',
        modo: modoSeleccionado(),
        dispositivo: idDispositivo()
      });
  }

  // =====================================================================
  //  PANTALLA DEL QUIZ
  // =====================================================================
  function comenzarQuiz(res) {
    if (!res || !Array.isArray(res.preguntas) || res.preguntas.length === 0) {
      ocultarCarga();
      var boton = $('btn-iniciar');
      if (boton) boton.disabled = false;
      var error = $('inicio-error');
      if (error) {
        error.textContent = 'No se recibieron preguntas del servidor. Intenta de nuevo.';
        error.classList.remove('oculto');
      }
      if (estado.pantallaCompletaLograda) salirPantallaCompleta();
      return;
    }
    estado.intentoId = res.intentoId;
    estado.nombre = res.nombre;
    estado.preguntas = res.preguntas;
    estado.respuestas = res.respuestas || {};
    estado.pistas = res.pistas || [];
    estado.maxPistas = res.maxPistas;
    estado.retroInmediata = !!res.retroInmediata;
    estado.verificadas = res.verificadas || {};
    estado.tiempos = res.tiempos || {};
    estado.tiempoNumero = null;
    estado.tiempoDesde = 0;
    estado.tiempoPausado = !!document.hidden;
    estado.verificando = false;
    estado.integridad = res.integridad || {};
    ['salidas', 'segundosFuera', 'advertencias', 'copiados'].forEach(function (k) {
      estado.integridad[k] = Number(estado.integridad[k]) || 0;
    });
    estado.integridad.incidentes = estado.integridad.incidentes || [];
    delete estado.integridad.cierre;
    estado.cierreIntegridad = '';
    estado.confianza = {};
    estado.ultimoIncidente = 0;
    estado.ignorarHasta = 0;
    estado.ventanaBase = medirVentana();
    estado.ventanaReducida = false;
    $('bloqueo-ventana').classList.add('oculto');
    estado.ocultoDesde = 0;
    estado.fueraDeFoco = false;
    estado.chats = {};
    estado.explicaciones = {};
    estado.actual = 0;
    estado.enviando = false;
    estado.finalizado = false;
    estado.reintentosEnvio = 0;
    estado.practica = !!res.practica;
    estado.secuencial = !!res.secuencial;
    estado.procedimiento = res.procedimiento || { habilitado: false, obligatorio: false, maxArchivos: 3, archivos: [] };
    estado.procedimiento.archivos = estado.procedimiento.archivos || [];
    estado.subiendo = false;
    estado.bloqueadoDispositivo = false;
    estado.refuerzo = !!res.refuerzo;
    estado.previa = !!res.previa;
    estado.axioma = !!res.axioma;
    estado.todasPreguntas = (res.preguntas || []).slice();
    estado.extrasDesbloqueadas = !quizConExtrasOpcionales_();
    estado.preguntas = preguntasActivas_();
    $('banda-practica').classList.toggle('oculto', !estado.practica);
    $('banda-practica').textContent = res.axioma
      ? 'Práctica con Axioma IA: mismas temáticas y cantidad que el quiz; ejercicios creados por la IA. No cuenta para la nota; al verificar verás la solución y al terminar te llega al correo.'
      : res.previa
      ? 'Práctica previa: ejercicios distintos a los del quiz para calentar. No cuenta para la nota; al verificar verás la solución paso a paso.'
      : res.refuerzo
      ? 'Práctica de refuerzo: ejercicios parecidos a los que fallaste, con otros números o en otra versión. No cuenta para la nota.'
      : 'Modo práctica: no cuenta para la nota. Al verificar o finalizar verás la solución paso a paso.';
    $('btn-finalizar').textContent = estado.practica ? 'Finalizar práctica' : 'Finalizar quiz';
    renderizarProcedimiento();

    // Si el navegador guardó respuestas que no alcanzaron a llegar al servidor, se recuperan.
    var respaldo = leerRespaldoLocal(res.intentoId);
    if (respaldo) {
      for (var clave in respaldo) {
        if (respaldo.hasOwnProperty(clave)) estado.respuestas[clave] = respaldo[clave];
      }
      programarGuardado();
    }
    // Al reanudar: si ya había respondido alguna extra, se desbloquean.
    if (!estado.extrasDesbloqueadas && estado.todasPreguntas.some(function (p) {
      return p.reserva && estado.respuestas[String(p.numero)] !== undefined && estado.respuestas[String(p.numero)] !== null;
    })) {
      estado.extrasDesbloqueadas = true;
      estado.preguntas = preguntasActivas_();
    }

    construirNavegador();
    deshabilitarControles(false);
    mostrarPregunta(0);
    if (quizConExtrasOpcionales_() && !estado.extrasDesbloqueadas) {
      mostrarToast('Primero las ' + (estado.config.totalPreguntas || 6) +
        ' preguntas. Al finalizar podrás decidir si haces ' +
        (estado.config.preguntasReserva || 2) +
        ' extras opcionales para reponer fallos (si las fallas, no restan).', 7000);
    }
    iniciarTemporizador(res.segundosRestantes);
    iniciarLatido();
    if (enPantallaCompleta()) estado.pantallaCompletaLograda = true;
    $('temporizador').classList.remove('oculto');
    $('barra-tiempo').classList.remove('oculto');
    $('nav-leyenda').classList.toggle('con-verif', estado.retroInmediata);
    $('nav-leyenda').classList.toggle('con-secuencial', estado.secuencial);
    $('indicador-guardado').textContent = '';
    abrirTutorMovil(false);
    mostrarPantalla('pantalla-quiz');

    aplicarMarcaAgua(res.nombre, res.carne);
    if (res.reanudado) {
      mostrarToast('Se reanudó tu intento en curso. El tiempo siguió corriendo.', 5000);
    } else if (res.tiempoAdicional > 0) {
      mostrarToast('Tienes ' + res.tiempoAdicional + ' % de tiempo adicional según la lista oficial del curso.', 6000);
    }
  }

  /** El quiz y la Práctica con Axioma IA ofrecen las extras opcionales. */
  function quizConExtrasOpcionales_() {
    var n = Number(estado.config && estado.config.preguntasReserva) || 0;
  if (n <= 0 || estado.previa || estado.refuerzo) return false;
    return (estado.todasPreguntas || []).some(function (p) { return p.reserva; });
  }

  function preguntasActivas_() {
    var todas = estado.todasPreguntas || estado.preguntas || [];
    if (!quizConExtrasOpcionales_() || estado.extrasDesbloqueadas) return todas.slice();
    return todas.filter(function (p) { return !p.reserva; });
  }

  function indicePrimeraExtra_() {
    for (var i = 0; i < estado.preguntas.length; i++) {
      if (estado.preguntas[i].reserva) return i;
    }
    return -1;
  }

  function desbloquearExtrasOpcionales_() {
    estado.extrasDesbloqueadas = true;
    estado.preguntas = preguntasActivas_();
    construirNavegador();
    actualizarNavegador();
    var i = indicePrimeraExtra_();
    if (i >= 0) mostrarPregunta(i);
    mostrarToast('Extras desbloqueadas: son opcionales. Si aciertas, pueden reponer una fallada; si fallas, no restan a la nota.', 6500);
  }

  function construirNavegador() {
    var nav = $('navegador-preguntas');
    nav.innerHTML = '';
    estado.preguntas.forEach(function (p, i) {
      var b = crear('button', 'nav-punto' + (p.reserva ? ' nav-reserva' : ''), String(p.posicion));
      b.type = 'button';
      b.title = p.reserva
        ? 'Extra opcional: si aciertas puede reponer una fallada; si fallas, no resta'
        : 'Ir a la pregunta ' + p.posicion;
      b.addEventListener('click', function () { irAPregunta(i); });
      nav.appendChild(b);
    });
  }

  function irAPregunta(indice) {
    if (indice < 0 || indice >= estado.preguntas.length || indice === estado.actual) return;
    if (estado.secuencial) {
      var actual = estado.preguntas[estado.actual];
      if (actual && !estaCompleta(actual)) {
        mostrarToast(mensajePendiente(actual), 3500);
        return;
      }
      if (indice > limiteNavegacion()) {
        mostrarToast(mensajePendiente(estado.preguntas[limiteNavegacion()]), 3500);
        return;
      }
    }
    mostrarPregunta(indice);
  }

  /** En modo secuencial con verificación, una pregunta está completa solo cuando fue verificada. */
  function estaCompleta(p) {
    return estado.retroInmediata ? !!estado.verificadas[p.numero] : estaRespondida(p);
  }

  function mensajePendiente(p) {
    if (!estaRespondida(p)) return 'Primero responde la pregunta ' + p.posicion + (estado.retroInmediata ? ' y verifícala.' : '.');
    return 'Verifica tu respuesta de la pregunta ' + p.posicion + ' para poder continuar.';
  }

  /** Índice de la primera pregunta sin completar: en modo secuencial no se puede pasar de ahí. */
  function limiteNavegacion() {
    for (var i = 0; i < estado.preguntas.length; i++) {
      if (estado.preguntas[i].reserva) continue;
      if (!estaCompleta(estado.preguntas[i])) return i;
    }
    return estado.preguntas.length - 1;
  }

  function actualizarBotonesAvance() {
    if (!estado.preguntas.length) return;
    var bloqueado = estado.enviando || estado.finalizado;
    var p = estado.preguntas[estado.actual];
    var falta = estado.secuencial && !estaCompleta(p);
    var porVerificar = falta && estaRespondida(p);
    $('btn-anterior').disabled = bloqueado || falta || estado.actual === 0;
    $('btn-siguiente').disabled = bloqueado || (falta && !porVerificar) || !!estado.verificando ||
      estado.actual === estado.preguntas.length - 1;
    var pendientes = preguntasSinResponder().length;
    var finBloqueado = estado.secuencial && pendientes > 0;
    $('btn-finalizar').disabled = bloqueado || finBloqueado;
    var listoParaExtras = !finBloqueado && quizConExtrasOpcionales_() && !estado.extrasDesbloqueadas;
    var base = (estado.config && estado.config.totalPreguntas) || 6;
    $('btn-finalizar').textContent = finBloqueado
      ? (estado.retroInmediata ? 'Responde y verifica todas las preguntas para finalizar (' : 'Responde todas las preguntas para finalizar (') +
        pendientes + ' pendiente' + (pendientes === 1 ? '' : 's') + ')'
      : (listoParaExtras ? 'Terminé las ' + base + ' · elegir extras o entregar'
        : (estado.practica ? 'Finalizar práctica' : 'Finalizar quiz'));
    $('aviso-secuencial').textContent = porVerificar
      ? 'Presiona “Verificar respuesta” para continuar. En este quiz no puedes avanzar ni regresar sin verificar.'
      : (estado.retroInmediata
        ? 'Responde y verifica esta pregunta para continuar. En este quiz no puedes avanzar ni regresar sin verificar.'
        : 'Responde esta pregunta para continuar con la siguiente.');
    $('aviso-secuencial').classList.toggle('oculto', !falta || bloqueado);
  }

  function mostrarPregunta(indice) {
    estado.actual = indice;
    var p = estado.preguntas[indice];
    if (!p) {
      mostrarToast('No se pudo cargar la pregunta ' + (indice + 1) + '.', 4000);
      return;
    }
    var total = estado.preguntas.length;
    iniciarTiempoPregunta(p.numero);

    var totalBase = (estado.config && estado.config.totalPreguntas) || total;
    $('progreso-texto').textContent = p.reserva
      ? 'Extra ' + (p.posicion - totalBase) + ' de ' + ((estado.config && estado.config.preguntasReserva) || (total - totalBase)) + ' (opcional)'
      : 'Pregunta ' + p.posicion + ' de ' + (estado.extrasDesbloqueadas ? total : totalBase);
    $('pregunta-etiqueta').textContent = p.reserva
      ? 'Pregunta extra ' + (p.posicion - (estado.config.totalPreguntas || 6)) + ' (opcional)'
      : 'Pregunta ' + p.posicion;
    $('pregunta-tipo').textContent = p.tipoTexto;
    var valor = estado.config && Number(estado.config.valorPregunta);
    $('pregunta-puntos').textContent = valor ? (Math.round(valor * 100) / 100) + ' pts' : '';
    $('pregunta-puntos').classList.toggle('oculto', !valor || estado.practica);
    $('pregunta-tema').textContent = (p.reserva
      ? 'Opcional: si acierta, puede reponer una fallada; si falla, no resta a la nota · '
      : '') + (p.tema || '');
    $('pregunta-tema').classList.toggle('oculto', !p.tema);
    var tarjeta = $('tarjeta-pregunta');
    tarjeta.classList.remove('entrar');
    void tarjeta.offsetWidth;
    tarjeta.classList.add('entrar');
    detenerLectura();
    $('btn-leer').classList.toggle('oculto', !lecturaDisponible());
    escribirMat($('pregunta-enunciado'), p.enunciado);
    dibujarGrafica($('pregunta-grafica'), p.grafica || null);

    renderizarRespuesta(p);
    actualizarVerificacion(p);
    actualizarNavegador();
    renderizarChat();

    actualizarBotonesAvance();
    $('tutor-mensaje').value = '';
    $('tutor-caracteres').textContent = textoContador(0);
  }

  /** Crea el control de respuesta según el tipo de pregunta. */
  function renderizarRespuesta(p) {
    var zona = $('pregunta-respuesta');
    zona.innerHTML = '';
    var r = estado.respuestas[p.numero];

    if (p.tipo === 'unica') {
      zona.appendChild(crearGrupoOpciones(p.opciones, 'radio', 'resp-' + p.numero, r ? [r] : [], false, function (sel) {
        registrarRespuesta(p.numero, sel[0] || null);
      }));

    } else if (p.tipo === 'pasos') {
      zona.appendChild(crearGrupoOpciones(p.opciones, 'checkbox', 'resp-' + p.numero, r || [], false, function (sel) {
        registrarRespuesta(p.numero, sel.length ? sel : null);
      }));

    } else if (p.tipo === 'vf') {
      var actual = r || { valor: null, justificacion: null };
      zona.appendChild(crear('div', 'subtitulo-respuesta', '1. La afirmación es:'));
      zona.appendChild(crearGrupoOpciones(
        [{ id: 'V', texto: 'Verdadera' }, { id: 'F', texto: 'Falsa' }],
        'radio', 'vf-valor-' + p.numero, actual.valor ? [actual.valor] : [], true,
        function (sel) {
          actual.valor = sel[0] || null;
          registrarRespuesta(p.numero, (actual.valor || actual.justificacion) ? { valor: actual.valor, justificacion: actual.justificacion } : null);
        }));
      zona.appendChild(crear('div', 'subtitulo-respuesta', '2. Justificación que respalda tu elección:'));
      zona.appendChild(crearGrupoOpciones(
        p.justificaciones, 'radio', 'vf-just-' + p.numero, actual.justificacion ? [actual.justificacion] : [], false,
        function (sel) {
          actual.justificacion = sel[0] || null;
          registrarRespuesta(p.numero, (actual.valor || actual.justificacion) ? { valor: actual.valor, justificacion: actual.justificacion } : null);
        }));

    } else {
      // Respuesta numérica o corta
      var input = document.createElement('input');
      input.type = 'text';
      input.id = 'resp-texto';
      input.maxLength = p.tipo === 'numerica' ? 30 : 80;
      input.autocomplete = 'off';
      input.placeholder = p.tipo === 'numerica' ? 'Escribe tu respuesta numérica' : 'Escribe tu respuesta';
      if (p.tipo === 'numerica' && p.simbolos !== 'trascendentes') input.inputMode = 'decimal';
      input.value = r || '';

      // Barra de símbolos: inserta en la posición del cursor.
      var botones = p.tipo === 'corta'
        ? [['x', 'x', 0], ['x²', '^2', 0], ['xⁿ', '^()', 1], ['√', '^(1/2)', 0], ['a/b', '/', 0], ['( )', '()', 1], ['−', '-', 0]]
        : [['a/b', '/', 0], ['( )', '()', 1], ['−', '-', 0], ['.', '.', 0]];
      if (p.simbolos === 'trascendentes') {
        botones = botones.concat(p.tipo === 'corta'
          ? [['sen', 'sin()', 1], ['cos', 'cos()', 1], ['eˣ', 'e^x', 0], ['ln', 'ln()', 1]]
          : [['π', 'pi', 0], ['e', 'e', 0], ['ln', 'ln()', 1], ['√', 'sqrt()', 1]]);
      }
      var barra = crear('div', 'barra-formulas');
      barra.setAttribute('aria-label', 'Insertar símbolos');
      botones.forEach(function (b) {
        var boton = crear('button', 'btn-formula', b[0]);
        boton.type = 'button';
        boton.title = 'Insertar ' + b[1];
        boton.addEventListener('mousedown', function (e) { e.preventDefault(); });
        boton.addEventListener('click', function () { insertarEnCampo(input, b[1], b[2]); });
        barra.appendChild(boton);
      });

      // Vista previa con notación matemática de lo que escribe el estudiante.
      var vista = crear('div', 'vista-previa');
      var actualizarVista = function () {
        vista.innerHTML = '';
        vista.appendChild(crear('span', 'vista-previa-etiqueta', 'Así se interpreta:'));
        var contenido = crear('span');
        var valor = input.value.trim();
        if (valor) {
          var r = expresionATex(valor);
          if (r.ok && r.tex) {
            escribirMat(contenido, '$' + r.tex + '$');
          } else {
            contenido.textContent = valor.replace(/\$/g, '');
            vista.appendChild(contenido);
            vista.appendChild(crear('span', 'vista-previa-aviso', ' (expresión incompleta: revisa paréntesis y operadores)'));
            return;
          }
        }
        vista.appendChild(contenido);
      };

      input.addEventListener('input', function () {
        var valor = input.value.trim();
        registrarRespuesta(p.numero, valor ? valor : null);
        actualizarVista();
      });
      zona.appendChild(barra);
      zona.appendChild(input);
      zona.appendChild(vista);
      if (p.tipo === 'corta') {
        zona.appendChild(crear('p', 'ayuda-formulas',
          'Escribe potencias con ^ (x^3), raíces como potencias (x^(1/2)) y usa paréntesis en denominadores: 1/(2x^2).'));
      }
      actualizarVista();
    }

    if (p.indicacion) zona.appendChild(crear('p', 'indicacion', p.indicacion));
  }

  /** Grupo de opciones (radio o checkbox) con letra y texto. */
  function crearGrupoOpciones(opciones, tipoInput, nombre, seleccionados, esVF, alCambiar) {
    var grupo = crear('div', 'opciones' + (esVF ? ' opciones-vf' : ''));
    (opciones || []).forEach(function (op) {
      var etiqueta = crear('label', 'opcion');
      var input = document.createElement('input');
      input.type = tipoInput;
      input.name = nombre;
      input.value = op.id;
      input.checked = seleccionados.indexOf(op.id) !== -1;
      if (input.checked) etiqueta.classList.add('seleccionada');

      input.addEventListener('change', function () {
        var marcados = grupo.querySelectorAll('input:checked');
        var valores = [];
        for (var i = 0; i < marcados.length; i++) valores.push(marcados[i].value);
        var etiquetas = grupo.querySelectorAll('.opcion');
        for (var j = 0; j < etiquetas.length; j++) {
          etiquetas[j].classList.toggle('seleccionada', etiquetas[j].querySelector('input').checked);
        }
        alCambiar(valores);
      });

      etiqueta.appendChild(input);
      if (!esVF) etiqueta.appendChild(crear('span', 'opcion-letra', op.id));
      var textoOpcion = crear('span', 'opcion-texto');
      escribirMat(textoOpcion, fraccionesGrandes(op.texto));
      etiqueta.appendChild(textoOpcion);
      var marca = crear('span', 'opcion-check');
      marca.appendChild(icono('check'));
      etiqueta.appendChild(marca);
      grupo.appendChild(etiqueta);
    });
    return grupo;
  }

  /** Guarda la respuesta en memoria y programa el respaldo en el servidor. */
  function registrarRespuesta(numero, valor) {
    if (estado.enviando || estado.finalizado) return;
    if (estado.verificadas[numero] || estado.verificando === numero) return;
    if (valor === null) {
      delete estado.respuestas[numero];
    } else {
      estado.respuestas[numero] = valor;
    }
    guardarRespaldoLocal();
    actualizarNavegador();
    actualizarVerificacion(estado.preguntas[estado.actual]);
    programarGuardado();
  }

  // =====================================================================
  //  RETROALIMENTACIÓN INMEDIATA (la respuesta queda fija al verificarla)
  // =====================================================================
  function actualizarVerificacion(p) {
    var boton = $('btn-verificar');
    var panel = $('pregunta-retro');
    var item = estado.verificadas[p.numero];

    var caja = $('confianza');
    if (item) {
      var entradas = document.querySelectorAll('#pregunta-respuesta input, #pregunta-respuesta button');
      for (var i = 0; i < entradas.length; i++) entradas[i].disabled = true;
      var elegidas = document.querySelectorAll('#pregunta-respuesta .opcion.seleccionada');
      for (var s = 0; s < elegidas.length; s++) elegidas[s].classList.add('verif-' + item.estado);
      var campoTexto = $('resp-texto');
      if (campoTexto) campoTexto.classList.add('verif-' + item.estado);
      boton.classList.add('oculto');
      caja.classList.add('oculto');
      mostrarRetroInmediata(item);
      return;
    }
    panel.classList.add('oculto');
    panel.innerHTML = '';

    var pedirConfianza = !!(estado.config && estado.config.pedirConfianza);
    var elegida = estado.confianza[p.numero] || '';
    caja.classList.toggle('oculto', !pedirConfianza || !estaRespondida(p));
    var opciones = caja.querySelectorAll('.confianza-opcion');
    for (var k = 0; k < opciones.length; k++) {
      var activa = opciones[k].getAttribute('data-valor') === elegida;
      opciones[k].classList.toggle('seleccionada', activa);
      opciones[k].setAttribute('aria-pressed', activa ? 'true' : 'false');
      opciones[k].disabled = estado.enviando || estado.finalizado || !!estado.verificando;
    }

    if (!estado.retroInmediata) {
      boton.classList.add('oculto');
      return;
    }
    var faltaConfianza = pedirConfianza && !elegida;
    boton.classList.remove('oculto');
    boton.disabled = estado.enviando || estado.finalizado || !!estado.verificando || !estaRespondida(p) || faltaConfianza;
    boton.textContent = estado.verificando === p.numero ? 'Verificando…'
      : (estaRespondida(p) && faltaConfianza ? 'Indica tu nivel de confianza para verificar' : 'Verificar respuesta');
  }

  function mostrarRetroInmediata(item) {
    var panel = $('pregunta-retro');
    var titulos = { correcta: '¡Correcto!', parcial: 'Parcialmente correcta', incorrecta: 'Incorrecta' };
    var iconos = { correcta: 'check', parcial: 'parcial', incorrecta: 'x' };
    panel.innerHTML = '';
    panel.className = 'retro-inmediata ' + item.estado;
    var cabecera = crear('div', 'retro-cabecera');
    var circulo = crear('span', 'retro-icono');
    circulo.appendChild(icono(iconos[item.estado] || 'parcial'));
    cabecera.appendChild(circulo);
    var textos = crear('div');
    textos.appendChild(crear('div', 'retro-titulo', titulos[item.estado] || ''));
    textos.appendChild(crear('div', 'retro-subtitulo', 'Tu respuesta quedó registrada.'));
    cabecera.appendChild(textos);
    panel.appendChild(cabecera);

    if (item.comentarioError) {
      var comentario = crear('p');
      escribirMat(comentario, item.comentarioError);
      panel.appendChild(comentario);
    }
    agregarSolucion(panel, item);
    if (item.explicable) agregarExplicacionError(panel, item.numero);
  }

  /** Práctica: Axioma IA explica en qué paso se equivocó el estudiante (después de verificar). */
  function agregarExplicacionError(contenedor, numero) {
    estado.explicaciones = estado.explicaciones || {};
    var caja = crear('div', 'explicacion-error');
    var guardada = estado.explicaciones[numero];
    if (guardada && guardada.texto) {
      caja.appendChild(crear('div', 'explicacion-titulo', 'Axioma IA: tu error'));
      var p = crear('p');
      escribirMat(p, guardada.texto);
      caja.appendChild(p);
      contenedor.appendChild(caja);
      return;
    }
    var boton = crear('button', 'btn btn-secundario', guardada && guardada.cargando ? 'Axioma IA está revisando tu respuesta…' : 'Explícame mi error');
    boton.type = 'button';
    boton.disabled = !!(guardada && guardada.cargando);
    boton.addEventListener('click', function () {
      estado.explicaciones[numero] = { cargando: true };
      boton.disabled = true;
      boton.textContent = 'Axioma IA está revisando tu respuesta…';
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            estado.explicaciones[numero] = { texto: res.texto };
          } else {
            delete estado.explicaciones[numero];
            mostrarToast((res && res.mensaje) || 'No fue posible obtener la explicación.', 4500);
          }
          refrescarSiVisible(numero);
        })
        .withFailureHandler(function () {
          delete estado.explicaciones[numero];
          mostrarToast('Sin conexión: intenta de nuevo en un momento.', 4500);
          refrescarSiVisible(numero);
        })
        .explicarMiError({ intentoId: estado.intentoId, numeroPregunta: numero });
    });
    caja.appendChild(boton);
    contenedor.appendChild(caja);
  }

  /** Solo en modo práctica: respuesta correcta y solución paso a paso. */
  function agregarSolucion(contenedor, item) {
    if (!item.respuestaCorrecta && !(item.solucion && item.solucion.length)) return;
    var caja = crear('div', 'solucion');
    if (item.respuestaCorrecta) {
      var correcta = crear('p', 'solucion-respuesta');
      correcta.appendChild(crear('strong', null, 'Respuesta correcta: '));
      var valor = crear('span');
      escribirMat(valor, fraccionesGrandes(item.respuestaCorrecta));
      correcta.appendChild(valor);
      caja.appendChild(correcta);
    }
    if (item.solucion && item.solucion.length) {
      caja.appendChild(crear('div', 'solucion-titulo', 'Solución paso a paso'));
      var pasos = crear('ol', 'solucion-pasos');
      item.solucion.forEach(function (paso) {
        var li = crear('li');
        escribirMat(li, fraccionesGrandes(paso));
        pasos.appendChild(li);
      });
      caja.appendChild(pasos);
    }
    contenedor.appendChild(caja);
  }

  function confirmarVerificacion() {
    var p = estado.preguntas[estado.actual];
    if (!estado.retroInmediata || estado.verificadas[p.numero] || estado.verificando || !estaRespondida(p)) return;
    if (estado.config && estado.config.pedirConfianza && !estado.confianza[p.numero]) {
      mostrarToast('Antes de verificar, indica qué tan seguro estás de tu respuesta.', 3500);
      return;
    }
    abrirModal('¿Verificar esta respuesta?',
      'Sabrás de inmediato si es correcta, pero después ya no podrás cambiarla.\n\n¿Deseas verificarla?',
      'Sí, verificar', function () { verificarPregunta(p); }, 'Revisar otra vez');
  }

  /** Repite la verificación que falló por conexión, solo si la respuesta no cambió desde entonces. */
  function reintentarVerificacionPendiente() {
    var pendiente = estado.verificacionPendiente;
    estado.verificacionPendiente = null;
    if (!pendiente || !quizEnCurso() || estado.verificando || estado.verificadas[pendiente.numero]) return;
    if (JSON.stringify(estado.respuestas[pendiente.numero] || null) !== pendiente.respuesta) return;
    for (var i = 0; i < estado.preguntas.length; i++) {
      if (estado.preguntas[i].numero === pendiente.numero) {
        verificarPregunta(estado.preguntas[i]);
        return;
      }
    }
  }

  function verificarPregunta(p) {
    var numero = p.numero;
    estado.verificacionPendiente = null;
    acumularTiempo();
    estado.verificando = numero;
    refrescarSiVisible(numero);

    google.script.run
      .withSuccessHandler(function (res) {
        estado.verificando = false;
        if (res && res.ok) {
          estado.verificadas[numero] = res.item;
          actualizarNavegador();
        } else {
          mostrarToast((res && res.mensaje) || 'No fue posible verificar la respuesta.', 4500);
        }
        refrescarSiVisible(numero);
      })
      .withFailureHandler(function () {
        estado.verificando = false;
        estado.verificacionPendiente = { numero: numero, respuesta: JSON.stringify(estado.respuestas[numero] || null) };
        mostrarToast('Sin conexión: la respuesta se verificará sola cuando vuelva el internet (o presiona Verificar de nuevo).', 6000);
        refrescarSiVisible(numero);
      })
      .verificarRespuesta({
        intentoId: estado.intentoId,
        numeroPregunta: numero,
        respuesta: estado.respuestas[numero] || null,
        confianza: estado.confianza[numero] || ''
      });
  }

  function refrescarSiVisible(numero) {
    var actual = estado.preguntas[estado.actual];
    if (actual && actual.numero === numero) {
      actualizarVerificacion(actual);
      actualizarContadorPistas();
    }
  }

  function programarGuardado() {
    clearTimeout(estado.temporizadorGuardado);
    estado.temporizadorGuardado = setTimeout(guardarAhora, 1500);
    if (quizEnCurso()) mostrarEstadoGuardado('guardando');
  }

  /**
   * Envía respuestas, integridad y la pregunta actual (para el monitoreo en vivo del docente).
   * La respuesta trae el tiempo restante: si el docente concedió tiempo extra, el reloj se ajusta.
   */
  function guardarAhora() {
    if (!estado.intentoId || estado.finalizado || estado.enviando) return;
    var actual = estado.preguntas[estado.actual];
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.otroDispositivo) {
          bloquearPorOtroDispositivo();
          return;
        }
        if (!estado.finalizado && !estado.enviando) mostrarEstadoGuardado(res && res.ok ? 'guardado' : 'error');
        if (estado.fallosGuardado >= FALLOS_PARA_AVISO_CONEXION) conexionRecuperada();
        estado.fallosGuardado = 0;
        if (estado.verificacionPendiente) reintentarVerificacionPendiente();
        ajustarTiempoServidor(res);
      })
      .withFailureHandler(function () {
        // Se reintenta en el siguiente guardado; queda el respaldo local.
        estado.fallosGuardado = (estado.fallosGuardado || 0) + 1;
        if (estado.finalizado || estado.enviando) return;
        mostrarEstadoGuardado('error');
        if (estado.fallosGuardado >= FALLOS_PARA_AVISO_CONEXION) $('indicador-conexion').classList.remove('oculto');
        clearTimeout(estado.temporizadorGuardado);
        estado.temporizadorGuardado = setTimeout(guardarAhora, ESPERA_REINTENTO_ENVIO_MS);
      })
      .guardarProgreso(estado.intentoId, estado.respuestas, estado.integridad,
        { posicion: actual ? actual.posicion : 0, dispositivo: idDispositivo(), tiempos: tiemposParaEnviar() });
  }

  // ---------- Tiempo por pregunta ----------
  /** Suma al contador de la pregunta visible el tiempo desde la última marca (sin contar la pestaña oculta). */
  function acumularTiempo() {
    var ahora = Date.now();
    var numero = estado.tiempoNumero;
    var desde = estado.tiempoDesde || ahora;
    estado.tiempoDesde = ahora;
    if (!numero || !estado.intentoId || estado.finalizado || estado.tiempoPausado || estado.verificadas[numero]) return;
    var segundos = (ahora - desde) / 1000;
    if (segundos <= 0 || segundos > 3600) return;
    estado.tiempos[numero] = (Number(estado.tiempos[numero]) || 0) + segundos;
  }

  function iniciarTiempoPregunta(numero) {
    acumularTiempo();
    estado.tiempoNumero = numero;
    estado.tiempoDesde = Date.now();
  }

  function tiemposParaEnviar() {
    acumularTiempo();
    var salida = {};
    Object.keys(estado.tiempos || {}).forEach(function (n) {
      var s = Math.round(Number(estado.tiempos[n]) || 0);
      if (s > 0) salida[n] = s;
    });
    return salida;
  }

  function ajustarTiempoServidor(res) {
    if (!res || !res.ok || typeof res.segundosRestantes !== 'number' || estado.finalizado || estado.enviando) return;
    var finServidor = Date.now() + res.segundosRestantes * 1000;
    if (finServidor - estado.fin > 20000) {
      var minutos = Math.round((finServidor - estado.fin) / 60000);
      estado.fin = finServidor;
      estado.totalSegundos = Math.max(estado.totalSegundos || 0, res.segundosRestantes);
      // Con más tiempo, los avisos que quedaron en el futuro vuelven a mostrarse.
      var restantes = res.segundosRestantes;
      estado.avisosTiempo = (estado.avisosTiempo || []).filter(function (s) { return s >= restantes; });
      actualizarTemporizador();
      mostrarToast('Tu docente te concedió ' + (minutos > 0 ? minutos + ' minuto(s) de ' : '') + 'tiempo adicional.', 6000);
    }
  }

  /** Señal periódica para que el docente vea quién sigue conectado. */
  function iniciarLatido() {
    clearInterval(estado.latido);
    if (estado.practica) return;
    estado.latido = setInterval(guardarAhora, 30000);
  }

  function estaRespondida(p) {
    var r = estado.respuestas[p.numero];
    if (!r) return false;
    if (p.tipo === 'vf') return !!(r.valor && r.justificacion);
    if (p.tipo === 'pasos') return r.length > 0;
    return String(r).trim().length > 0;
  }

  function actualizarNavegador() {
    var botones = $('navegador-preguntas').children;
    var respondidas = 0;
    var limite = estado.secuencial ? limiteNavegacion() : estado.preguntas.length;
    var bloqueado = estado.enviando || estado.finalizado;
    var actualPendiente = estado.secuencial && estado.preguntas[estado.actual] && !estaCompleta(estado.preguntas[estado.actual]);
    estado.preguntas.forEach(function (p, i) {
      var ok = estaRespondida(p);
      if (ok) respondidas++;
      botones[i].classList.toggle('respondida', ok);
      botones[i].classList.toggle('actual', i === estado.actual);
      var cerrada = i > limite || (actualPendiente && i !== estado.actual);
      botones[i].classList.toggle('bloqueada', cerrada);
      botones[i].disabled = bloqueado || cerrada;
      var item = estado.verificadas[p.numero];
      ['correcta', 'parcial', 'incorrecta'].forEach(function (e) {
        botones[i].classList.toggle('verif-' + e, !!item && item.estado === e);
      });
      var detalle = item ? 'verificada, ' + item.estado : (ok ? 'respondida' : 'sin responder');
      botones[i].setAttribute('aria-label', 'Pregunta ' + p.posicion + ', ' + detalle + (cerrada ? ', bloqueada' : ''));
      if (i === estado.actual) botones[i].setAttribute('aria-current', 'step');
      else botones[i].removeAttribute('aria-current');
    });
    var porcentaje = Math.round(respondidas / estado.preguntas.length * 100);
    $('respondidas-texto').textContent = respondidas + ' de ' + estado.preguntas.length + ' respondidas · ' + porcentaje + ' %';
    $('barra-progreso-relleno').style.width = Math.max(porcentaje, 2) + '%';
    actualizarBotonesAvance();
  }

  function preguntasSinResponder() {
    return estado.preguntas.filter(function (p) {
      return !p.reserva && (estado.secuencial ? !estaCompleta(p) : !estaRespondida(p));
    })
      .map(function (p) { return p.posicion; });
  }

  function preguntaPorNumero(numero) {
    for (var i = 0; i < estado.preguntas.length; i++) {
      if (estado.preguntas[i].numero === numero) return estado.preguntas[i];
    }
    return null;
  }

  // =====================================================================
  //  TEMPORIZADOR
  // =====================================================================
  var AVISOS_TIEMPO = [600, 300, 60];

  function iniciarTemporizador(segundos) {
    clearInterval(estado.intervalo);
    estado.fin = Date.now() + segundos * 1000;
    var configurados = estado.config && !estado.refuerzo && !estado.previa && !estado.axioma ? Number(estado.config.tiempoMinutos) * 60 : 0;
    estado.totalSegundos = Math.max(segundos, configurados || 0, 1);
    // Los avisos cuyo momento ya pasó (por ejemplo, al reanudar) no se muestran.
    estado.avisosTiempo = AVISOS_TIEMPO.filter(function (s) { return segundos <= s; });
    actualizarTemporizador();
    estado.intervalo = setInterval(actualizarTemporizador, 500);
  }

  function avisarTiempo(segundos) {
    var minutos = segundos / 60;
    mostrarToast(minutos === 1
      ? 'Queda 1 minuto. Revisa tu respuesta actual: al terminar el tiempo el quiz se envía solo.'
      : 'Quedan ' + minutos + ' minutos.', 6000);
    var caja = $('temporizador');
    caja.classList.remove('pulso-tiempo');
    void caja.offsetWidth;
    caja.classList.add('pulso-tiempo');
    if (navigator.vibrate) {
      try { navigator.vibrate(minutos === 1 ? [300, 150, 300, 150, 300] : [250, 120, 250]); } catch (e) { /* sin vibración */ }
    }
  }

  function actualizarTemporizador() {
    var restantes = Math.max(0, Math.round((estado.fin - Date.now()) / 1000));
    var caja = $('temporizador');
    $('tiempo-restante').textContent = formatearReloj(restantes);
    var fraccion = Math.max(0, Math.min(1, restantes / (estado.totalSegundos || 1)));
    $('anillo-progreso').style.strokeDashoffset = String(119.38 * (1 - fraccion));
    $('barra-tiempo-relleno').style.width = (fraccion * 100) + '%';
    var advertencia = restantes <= 300 && restantes > 60;
    var critico = restantes <= 60;
    [caja, $('barra-tiempo')].forEach(function (el) {
      el.classList.toggle('advertencia', advertencia);
      el.classList.toggle('critico', critico);
    });
    if (restantes > 0 && !estado.enviando && !estado.finalizado) {
      AVISOS_TIEMPO.forEach(function (s) {
        if (restantes <= s && estado.avisosTiempo.indexOf(s) === -1) {
          estado.avisosTiempo.push(s);
          if (restantes > s - 30) avisarTiempo(s);
        }
      });
    }

    if (restantes <= 0 && !estado.enviando && !estado.finalizado) {
      cerrarModal();
      mostrarToast('El tiempo terminó. Tu quiz se está enviando automáticamente.', 5000);
      enviarQuiz(true);
    }
  }

  // =====================================================================
  //  AXIOMA IA
  // =====================================================================
  function agregarMensajeChat(numero, rol, texto) {
    if (!estado.chats[numero]) estado.chats[numero] = [];
    estado.chats[numero].push({ rol: rol, texto: texto, hora: horaActual() });
    if (estado.preguntas[estado.actual] && estado.preguntas[estado.actual].numero === numero) renderizarChat();
  }

  function renderizarChat() {
    var p = estado.preguntas[estado.actual];
    var chat = $('tutor-chat');
    chat.innerHTML = '';
    var mensajes = estado.chats[p.numero] || [];

    if (!mensajes.length) {
      chat.appendChild(crear('p', 'chat-vacio', '¿Atascado? Escribe tu duda y presiona Enter: Axioma IA te hará una pregunta o te dará una orientación para avanzar.'));
    }
    mensajes.forEach(function (m) {
      var burbuja = crear('div', 'burbuja burbuja-' + m.rol);
      if (m.rol === 'estudiante') {
        burbuja.textContent = m.texto;
      } else {
        escribirMat(burbuja, m.texto);
      }
      if (m.hora) burbuja.appendChild(crear('span', 'burbuja-hora', m.hora));
      chat.appendChild(burbuja);
    });
    if (estado.pidiendoPista === p.numero) {
      chat.appendChild(crear('div', 'burbuja burbuja-tutor escribiendo', 'Axioma IA está analizando tu consulta…'));
    }
    chat.scrollTop = chat.scrollHeight;
    actualizarContadorPistas();
  }

  function actualizarContadorPistas() {
    var p = estado.preguntas[estado.actual];
    var usadas = estado.pistas[p.numero - 1] || 0;
    var max = estado.maxPistas;
    $('tutor-contador').textContent = usadas + '/' + max;
    var puntos = $('tutor-puntos');
    puntos.innerHTML = '';
    for (var k = 0; k < max; k++) puntos.appendChild(crear('i', k < usadas ? 'usada' : ''));
    $('btn-tutor-flotante').classList.toggle('con-mensajes', !!(estado.chats[p.numero] && estado.chats[p.numero].length));
    var verificada = !!estado.verificadas[p.numero];
    var agotadas = usadas >= max;
    var conTexto = $('tutor-mensaje').value.trim().length > 0;
    $('btn-pista').disabled = estado.enviando || estado.finalizado || !!estado.pidiendoPista || verificada || (agotadas && !conTexto);
    $('btn-pista').textContent = verificada ? 'Pregunta ya verificada'
      : (agotadas ? (conTexto ? 'Responder a Axioma IA' : 'Pistas agotadas: escribe tu duda') : (conTexto ? 'Enviar y pedir pista' : 'Pedir una pista'));
    $('btn-pista').title = agotadas ? 'Ya no recibirás pistas nuevas, pero Axioma IA responde a tus comentarios sin descontar pistas.' : '';
  }

  function motivoPistaBloqueada() {
    if (!estado.preguntas.length) return 'Espera a que cargue la pregunta.';
    var p = estado.preguntas[estado.actual];
    if (estado.enviando || estado.finalizado) return 'El quiz ya se envió o se está enviando.';
    if (estado.verificadas[p.numero]) return 'Esta pregunta ya está verificada. Axioma IA queda para las que faltan.';
    var usadas = estado.pistas[p.numero - 1] || 0;
    if (usadas >= estado.maxPistas && !$('tutor-mensaje').value.trim()) {
      return 'Ya usaste tus pistas. Escribe tu duda y pulsa Enviar.';
    }
    if (estado.pidiendoPista && Date.now() - (estado.pistaDesde || 0) < 8000) {
      return 'Axioma IA todavía está contestando. Espera unos segundos.';
    }
    return '';
  }

  function pedirPista() {
    var motivo = motivoPistaBloqueada();
    if (motivo) {
      mostrarToast(motivo, 4500);
      return;
    }
    var p = estado.preguntas[estado.actual];
    var numero = p.numero;
    var mensaje = $('tutor-mensaje').value.trim().slice(0, 300);
    if ((estado.pistas[numero - 1] || 0) >= estado.maxPistas && !mensaje) {
      mostrarToast('Ya usaste tus pistas. Escribe tu duda o lo que intentaste y Axioma IA te responderá sin descontar pistas.', 4500);
      return;
    }

    if (mensaje) agregarMensajeChat(numero, 'estudiante', mensaje);
    $('tutor-mensaje').value = '';
    $('tutor-caracteres').textContent = textoContador(0);

    var reqId = (estado.pistaReq = (estado.pistaReq || 0) + 1);
    estado.pidiendoPista = numero;
    estado.pistaDesde = Date.now();
    if (estado.pistaTimer) clearTimeout(estado.pistaTimer);
    estado.pistaTimer = setTimeout(function () {
      if (estado.pistaReq !== reqId) return;
      estado.pidiendoPista = false;
      agregarMensajeChat(numero, 'sistema', 'Axioma IA tardó esta vez. Vuelve a enviar: te responde con la pista local.');
      renderizarChat();
    }, 28000);
    renderizarChat();

    google.script.run
      .withSuccessHandler(function (res) {
        if (estado.pistaReq !== reqId) return;
        if (estado.pistaTimer) clearTimeout(estado.pistaTimer);
        estado.pidiendoPista = false;
        var lista = estado.chats[numero] || [];
        if (lista.length && lista[lista.length - 1].rol === 'sistema' && /tardó demasiado/.test(lista[lista.length - 1].texto)) {
          lista.pop();
        }
        if (res && res.ok) {
          estado.pistas[numero - 1] = res.pistasUsadas;
          agregarMensajeChat(numero, res.limite ? 'sistema' : 'tutor', res.texto);
        } else {
          agregarMensajeChat(numero, 'sistema', (res && res.mensaje) || 'Axioma IA no está disponible. Intenta de nuevo.');
        }
        renderizarChat();
      })
      .withFailureHandler(function () {
        if (estado.pistaReq !== reqId) return;
        if (estado.pistaTimer) clearTimeout(estado.pistaTimer);
        estado.pidiendoPista = false;
        agregarMensajeChat(numero, 'sistema', 'No hubo conexión con Axioma IA. Intenta de nuevo.');
        renderizarChat();
      })
      .consultarTutorGuia({
        intentoId: estado.intentoId,
        numeroPregunta: numero,
        respuesta: estado.respuestas[numero] || null,
        mensaje: mensaje
      });
  }

  // =====================================================================
  //  FINALIZACIÓN
  // =====================================================================
  function confirmarFinalizar() {
    if (estado.enviando || estado.finalizado) return;
    if (estado.subiendo) {
      mostrarToast('Espera a que termine de subirse tu archivo.', 3500);
      return;
    }
    var proc = estado.procedimiento;
    if (proc.habilitado && proc.obligatorio && !proc.archivos.length) {
      abrirModal('Falta tu procedimiento',
        'Antes de finalizar debes adjuntar al menos una foto o un PDF con tu procedimiento escrito (sección “Procedimiento escrito”, debajo de la pregunta).',
        'Entendido', function () { $('procedimiento').scrollIntoView({ behavior: 'smooth' }); }, null);
      return;
    }
    var pendientes = preguntasSinResponder();
    if (estado.secuencial && pendientes.length) {
      mostrarToast('Debes responder todas las preguntas antes de finalizar (pendientes: ' + pendientes.join(', ') + ').', 4500);
      return;
    }

    // Tras las 6: ofrecer siempre las 2 extras opcionales (quiz y práctica con Axioma IA).
    if (quizConExtrasOpcionales_() && !estado.extrasDesbloqueadas) {
      var nExtra = Number(estado.config.preguntasReserva) || 2;
      var totalBase = estado.config.totalPreguntas || 6;
      abrirModal(
        '¿Quieres hacer ' + nExtra + ' preguntas extras?',
        (pendientes.length
          ? 'Atención: te falta responder ' + pendientes.length + ' de las ' + totalBase + ' preguntas (' + pendientes.join(', ') +
            '); sin respuesta cuentan como incorrectas.\n\n'
          : 'Ya respondiste las ' + totalBase + ' preguntas ' + (estado.practica ? 'de la práctica' : 'del quiz') + '.\n\n') +
          'Puedes intentar ' + nExtra + ' extras opcionales: si aciertas, pueden reponer alguna que fallaste. ' +
          'Si las fallas o las dejas en blanco, NO restan ' + (estado.practica ? 'puntaje' : 'a tu nota') + '.\n\n' +
          'El tiempo sigue corriendo.',
        'Sí, hacer las extras',
        function () { desbloquearExtrasOpcionales_(); },
        'No, entregar ahora',
        function () { enviarQuiz(false); }
      );
      return;
    }

    var actividad = estado.practica ? 'la práctica' : 'el quiz';
    var texto = pendientes.length
      ? 'Atención: tienes ' + pendientes.length + ' pregunta(s) sin contestar: ' + pendientes.join(', ') +
        '.\nLas preguntas sin respuesta se califican como incorrectas.\n\n¿Deseas finalizar de todos modos?'
      : (estado.extrasDesbloqueadas
        ? 'Puedes dejar extras sin responder (no restan). Una vez enviado, no podrás modificar tus respuestas.\n\n¿Deseas finalizar ' + actividad + '?'
        : 'Respondiste todas las preguntas. Una vez enviado, no podrás modificar tus respuestas.\n\n¿Deseas finalizar ' + actividad + '?');
    abrirModal('¿Finalizar ' + actividad + '?', texto, 'Sí, finalizar', function () { enviarQuiz(false); }, 'Seguir respondiendo');
  }

  function deshabilitarControles(deshabilitar) {
    ['btn-anterior', 'btn-siguiente', 'btn-finalizar', 'btn-pista', 'btn-verificar'].forEach(function (id) {
      $(id).disabled = deshabilitar;
    });
    var entradas = document.querySelectorAll('#pregunta-respuesta input, #pregunta-respuesta button, #tutor-mensaje, .nav-punto');
    for (var i = 0; i < entradas.length; i++) entradas[i].disabled = deshabilitar;
    if (!deshabilitar && estado.preguntas.length) {
      actualizarNavegador();
      actualizarVerificacion(estado.preguntas[estado.actual]);
      actualizarContadorPistas();
    }
    renderizarProcedimiento();
  }

  /** Envía el quiz una sola vez (protección contra doble clic). */
  function enviarQuiz(tiempoAgotado) {
    if (estado.enviando || estado.finalizado) return;
    cerrarPeriodoFuera();
    estado.enviando = true;
    actualizarBloqueoVentana();
    clearTimeout(estado.temporizadorGuardado);
    clearInterval(estado.latido);
    deshabilitarControles(true);
    mostrarCarga(estado.cierreIntegridad ? 'La actividad se cerró por salir de la pestaña o reducir la ventana. Enviando tus respuestas…'
      : (tiempoAgotado ? 'El tiempo terminó. Enviando tus respuestas…' : 'Calificando tu actividad…'));

    google.script.run
      .withSuccessHandler(function (res) {
        ocultarCarga();
        if (res && res.ok) {
          estado.finalizado = true;
          clearInterval(estado.intervalo);
          borrarRespaldoLocal(estado.intentoId);
          $('indicador-conexion').classList.add('oculto');
          mostrarResultados(res);
        } else {
          manejarErrorEnvio(res, tiempoAgotado);
        }
      })
      .withFailureHandler(function () {
        esperarConexionEnvio(tiempoAgotado);
      })
      .finalizarQuiz({
        intentoId: estado.intentoId,
        respuestas: estado.respuestas,
        tiempoAgotado: !!tiempoAgotado,
        integridad: estado.integridad,
        confianza: estado.confianza,
        tiempos: tiemposParaEnviar(),
        cierreIntegridad: estado.cierreIntegridad || '',
        dispositivo: idDispositivo()
      });
  }

  /**
   * Sin conexión al enviar: las respuestas quedan en el equipo y el envío se repite solo
   * (cada pocos segundos y en cuanto vuelve el internet), sin límite de intentos.
   */
  function esperarConexionEnvio(tiempoAgotado) {
    estado.envioPendiente = { tiempoAgotado: !!tiempoAgotado };
    estado.enviando = true;
    deshabilitarControles(true);
    guardarRespaldoLocal();
    $('indicador-conexion').classList.remove('oculto');
    mostrarCarga('Sin conexión. Tu quiz se enviará automáticamente cuando vuelva el internet. No cierres esta página.');
    clearTimeout(estado.temporizadorEnvio);
    estado.temporizadorEnvio = setTimeout(reintentarEnvioPendiente, ESPERA_REINTENTO_ENVIO_MS);
  }

  function reintentarEnvioPendiente() {
    var pendiente = estado.envioPendiente;
    clearTimeout(estado.temporizadorEnvio);
    if (!pendiente || estado.finalizado) return;
    estado.envioPendiente = null;
    estado.enviando = false;
    enviarQuiz(pendiente.tiempoAgotado);
  }

  function manejarErrorEnvio(res, tiempoAgotado) {
    estado.enviando = false;
    if (res && res.otroDispositivo) {
      bloquearPorOtroDispositivo();
      return;
    }
    var mensaje = (res && res.mensaje) || 'No fue posible enviar el quiz.';

    if (!res || !res.reintentar) {
      // Error definitivo (sesión expirada, intento duplicado, etc.).
      estado.finalizado = true;
      clearInterval(estado.intervalo);
      abrirModal('No se pudo registrar el intento', mensaje, 'Entendido', null, null);
      return;
    }

    var bloqueoServidor = /ocupado|atendiendo|registrando otros intentos|varias solicitudes/i.test(mensaje);
    if (bloqueoServidor && estado.reintentosEnvio < MAX_REINTENTOS_BLOQUEO) {
      estado.reintentosEnvio++;
      mostrarToast('El servidor está registrando otros intentos. Tus respuestas siguen guardadas; reintentando (' +
        estado.reintentosEnvio + '/' + MAX_REINTENTOS_BLOQUEO + ')…', 3500);
      setTimeout(function () { enviarQuiz(tiempoAgotado); }, 3500);
      return;
    }

    // Envíos forzados (tiempo agotado o cierre por integridad): se reintentan sin devolver el control.
    var forzado = tiempoAgotado || !!estado.cierreIntegridad;
    if (forzado && estado.reintentosEnvio < MAX_REINTENTOS_AUTOMATICOS) {
      estado.reintentosEnvio++;
      mostrarToast(mensaje + ' Reintentando (' + estado.reintentosEnvio + '/' + MAX_REINTENTOS_AUTOMATICOS + ')…', 3000);
      setTimeout(function () { enviarQuiz(tiempoAgotado); }, 3000);
      return;
    }

    if (forzado) {
      deshabilitarControles(true);
      abrirModal('Error al enviar', mensaje + '\nTus respuestas siguen guardadas. Presiona “Reintentar”.',
        'Reintentar', function () { enviarQuiz(tiempoAgotado); }, null);
    } else {
      deshabilitarControles(false);
      iniciarLatido();
      abrirModal('Error al enviar', mensaje + '\nTus respuestas siguen guardadas.',
        'Reintentar', function () { enviarQuiz(false); }, 'Cerrar');
    }
  }

  // =====================================================================
  //  PANTALLA FINAL
  // =====================================================================
  function mostrarResultados(res) {
    clearInterval(estado.latido);
    salirPantallaCompleta();
    $('temporizador').classList.add('oculto');
    $('barra-tiempo').classList.add('oculto');
    abrirTutorMovil(false);
    $('bloqueo-ventana').classList.add('oculto');
    $('final-nombre').textContent = 'Estudiante: ' + res.nombre;
    document.querySelector('.tarjeta-final h1').textContent = res.practica ? 'Resultados de la práctica' : 'Resultados del quiz';
    $('final-nota').nextElementSibling.textContent = res.practica ? 'Puntaje de práctica' : 'Nota sobre 100';
    $('final-revision-nota').textContent = res.practica
      ? 'Modo práctica: para cada pregunta verás la respuesta correcta y la solución paso a paso. Este intento no cuenta para la nota.'
      : (estado.config && estado.config.mostrarSolucion
        ? 'Revisa cada pregunta: se indica si tu respuesta fue correcta, por qué, y la solución paso a paso.'
        : 'Revisa cada pregunta: se indica si tu respuesta fue correcta y qué conviene repasar. No se muestra la clave de respuestas.');

    var estadoEl = $('final-estado');
    estadoEl.textContent = 'Estado del intento: ' + res.estado +
      (res.procedimientos && res.procedimientos.length ? ' · Procedimiento adjunto: ' + res.procedimientos.length + ' archivo(s)' : '');
    if (res.cierreIntegridad) {
      estadoEl.textContent += ' · Motivo: ' + res.cierreIntegridad + '. Tu docente fue notificado.';
    }
    estadoEl.className = 'estado-intento ' +
      (res.estado === 'Finalizado' ? 'estado-finalizado' : res.estado === 'Incompleto' ? 'estado-incompleto' : 'estado-agotado');

    var plan = $('final-plan');
    plan.innerHTML = '';
    (res.planEstudio || []).forEach(function (item) {
      var li = crear('li');
      li.appendChild(crear('strong', null, item.tema));
      li.appendChild(crear('span', null, item.recomendacion));
      plan.appendChild(li);
    });
    $('final-plan-seccion').classList.toggle('oculto', !(res.planEstudio && res.planEstudio.length));

    $('final-aciertos').textContent = res.aciertos + ' / ' + res.totalPreguntas;
    var notaMinima = estado.config && estado.config.notaAprobacion !== undefined ? Number(estado.config.notaAprobacion) : 70;
    var aprobado = Number(res.nota) >= notaMinima;
    pintarNotaCirculo(Number(res.nota) || 0, aprobado);
    var veredicto = $('final-veredicto');
    veredicto.textContent = aprobado ? 'Aprobado' : 'No aprobado';
    veredicto.className = 'veredicto ' + (aprobado ? 'aprobado' : 'reprobado') + (res.practica ? ' oculto' : '');
    pintarGraficoTemas(res.revision || []);
    if (aprobado && !res.practica) setTimeout(lanzarConfeti, 400);
    $('final-tiempo').textContent = res.tiempoLegible;
    $('final-pistas').textContent = res.totalPistas;

    var lista = $('final-temas');
    lista.innerHTML = '';
    if (res.temasReforzar && res.temasReforzar.length) {
      res.temasReforzar.forEach(function (t) { lista.appendChild(crear('li', null, t)); });
    } else {
      lista.appendChild(crear('li', null, '¡Ninguno! Respondiste correctamente todas las preguntas.'));
    }

    $('final-mensaje').textContent = res.mensaje;
    $('final-frase-texto').textContent = res.fraseMotivacion || '';
    $('final-frase').classList.toggle('oculto', !res.fraseMotivacion);
    pintarAvisoCorreo(res);
    mostrarRevision(res.revision || []);
    estado.intentoTerminado = res.intentoId;
    prepararEncuesta(res.intentoId);
    var fallados = (res.numerosFallados || []).length;
    $('final-refuerzo').classList.toggle('oculto', !res.refuerzoDisponible);
    $('final-refuerzo-texto').textContent = fallados + ' ejercicio' + (fallados === 1 ? '' : 's') +
      ' del mismo tema que ' + (fallados === 1 ? 'la pregunta que fallaste' : 'las preguntas que fallaste') +
      ', con otros números. Con solución paso a paso; no cuenta para la nota.';
    $('btn-refuerzo').disabled = false;
    if (res.refuerzo) document.querySelector('.tarjeta-final h1').textContent = 'Resultados de la práctica de refuerzo';
    if (res.axioma) document.querySelector('.tarjeta-final h1').textContent = 'Resultados de la práctica con Axioma IA';
    if (res.previa) {
      document.querySelector('.tarjeta-final h1').textContent = 'Resultados de la práctica previa';
      marcarPreviaHecha();
    }
    $('btn-final-accion').textContent = res.previa ? 'Volver al inicio para el quiz'
      : (res.practica ? 'Practicar de nuevo' : (res.variosIntentos ? 'Volver al inicio' : 'Cerrar'));
    $('btn-final-accion').disabled = false;
    $('final-cierre').classList.add('oculto');
    estado.variosIntentos = res.variosIntentos;
    mostrarPantalla('pantalla-final');
    if (res.tareasPendientes) completarEntrega(res, 0);
  }

  /**
   * La nota ya está registrada; el servidor termina aparte la frase de Axioma IA y los correos
   * (con PDF), que pueden tardar. Mientras tanto la pantalla avisa que el correo se está enviando.
   */
  function completarEntrega(res, intento) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r || !r.ok) {
          if (intento < 2) setTimeout(function () { completarEntrega(res, intento + 1); }, 4000);
          else pintarAvisoCorreo({ axioma: res.axioma, correo: res.correo, estadoCorreo: 'no_aplica' });
          return;
        }
        if (r.enCurso && intento < 20) {
          setTimeout(function () { completarEntrega(res, intento + 1); }, 5000);
          return;
        }
        if (r.fraseMotivacion) {
          $('final-frase-texto').textContent = r.fraseMotivacion;
          $('final-frase').classList.remove('oculto');
        }
        pintarAvisoCorreo({ axioma: res.axioma, correo: r.correo || res.correo, comprobanteEnviado: r.comprobanteEnviado, estadoCorreo: r.estadoCorreo });
      })
      .withFailureHandler(function () {
        if (intento < 2) setTimeout(function () { completarEntrega(res, intento + 1); }, 4000);
      })
      .completarFinalizacion(res.intentoId);
  }

  function pintarAvisoCorreo(res) {
    var aviso = $('final-comprobante');
    aviso.classList.remove('aviso-error');
    if (res.estadoCorreo === 'pendiente' && res.correo) {
      aviso.textContent = res.axioma
        ? 'Enviando las preguntas de esta práctica con su solución a ' + res.correo + '…'
        : 'Enviando tu comprobante a ' + res.correo + '… Tu nota ya quedó registrada.';
      aviso.classList.remove('oculto');
    } else if (res.axioma && res.comprobanteEnviado && res.correo) {
      aviso.textContent = 'Te enviamos las preguntas de esta práctica con su solución paso a paso a ' + res.correo +
        '. Si no lo ves en unos minutos, revisa la carpeta de Spam o Correo no deseado.';
      aviso.classList.remove('oculto');
    } else if (res.axioma && res.estadoCorreo === 'error') {
      aviso.textContent = 'No fue posible enviar la práctica a tu correo esta vez (puede ser el límite de envíos por hora). Las soluciones están abajo.';
      aviso.classList.add('aviso-error');
      aviso.classList.remove('oculto');
    } else if (res.comprobanteEnviado && res.correo) {
      aviso.textContent = 'Se envió un comprobante con tu nota y la retroalimentación a ' + res.correo +
        '. Si no lo ves en unos minutos, revisa la carpeta de Spam o Correo no deseado.';
      aviso.classList.remove('oculto');
    } else if (res.estadoCorreo === 'error') {
      aviso.textContent = 'Tu intento quedó registrado, pero no fue posible enviar el comprobante a ' + res.correo +
        '. Tu docente puede reenviarlo; no necesitas repetir el quiz.';
      aviso.classList.add('aviso-error');
      aviso.classList.remove('oculto');
    } else {
      aviso.classList.add('oculto');
    }
  }

  function sinAnimaciones() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  /** Círculo de la nota: el anillo y el número suben de 0 a la nota obtenida. */
  function pintarNotaCirculo(nota, aprobado) {
    var circulo = $('nota-circulo');
    var valor = $('final-nota');
    circulo.className = 'nota-circulo ' + (aprobado ? 'aprobado' : 'reprobado');
    var destino = Math.max(0, Math.min(100, nota));
    if (sinAnimaciones()) {
      circulo.style.setProperty('--pct', destino);
      valor.textContent = nota;
      return;
    }
    var inicio = null;
    var duracion = 1100;
    function paso(t) {
      if (inicio === null) inicio = t;
      var avance = Math.min(1, (t - inicio) / duracion);
      var suave = 1 - Math.pow(1 - avance, 3);
      circulo.style.setProperty('--pct', destino * suave);
      valor.textContent = avance < 1 ? Math.round(nota * suave) : nota;
      if (avance < 1) requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  }

  /** Barras de aciertos por tema (una pregunta parcial cuenta como media). */
  function pintarGraficoTemas(revision) {
    var temas = {};
    var orden = [];
    revision.forEach(function (item) {
      var tema = item.tema || 'Otros';
      if (!temas[tema]) { temas[tema] = { total: 0, puntos: 0 }; orden.push(tema); }
      temas[tema].total++;
      temas[tema].puntos += item.estado === 'correcta' ? 1 : (item.estado === 'parcial' ? 0.5 : 0);
    });
    var grafico = $('final-temas-grafico');
    grafico.innerHTML = '';
    orden.forEach(function (tema) {
      var t = temas[tema];
      var pct = Math.round(t.puntos / t.total * 100);
      var fila = crear('div', 'tema-fila');
      fila.appendChild(crear('span', 'tema-nombre', tema));
      var barra = crear('div', 'tema-barra');
      var relleno = crear('div', 'tema-relleno ' + (pct >= 70 ? 'alto' : pct >= 40 ? 'medio' : 'bajo'));
      barra.appendChild(relleno);
      fila.appendChild(barra);
      fila.appendChild(crear('span', 'tema-valor', (Math.round(t.puntos * 10) / 10) + '/' + t.total));
      grafico.appendChild(fila);
      setTimeout(function () { relleno.style.width = Math.max(pct, 3) + '%'; }, 60);
    });
    $('final-temas-grafico-seccion').classList.toggle('oculto', orden.length < 2);
  }

  function lanzarConfeti() {
    if (sinAnimaciones()) return;
    var colores = ['#00a9e0', '#00467f', '#15803d', '#f59e0b', '#e11d48', '#a855f7'];
    var capa = crear('div', 'confeti');
    for (var i = 0; i < 90; i++) {
      var pieza = crear('i');
      pieza.style.left = (Math.random() * 100) + '%';
      pieza.style.background = colores[i % colores.length];
      pieza.style.animationDelay = (Math.random() * 0.8) + 's';
      pieza.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
      pieza.style.transform = 'rotate(' + Math.round(Math.random() * 360) + 'deg)';
      capa.appendChild(pieza);
    }
    document.body.appendChild(capa);
    setTimeout(function () { if (capa.parentNode) capa.parentNode.removeChild(capa); }, 4800);
  }

  /** Retroalimentación por pregunta (sin clave de respuestas). */
  function mostrarRevision(revision) {
    var seccion = $('final-revision-seccion');
    var lista = $('final-revision');
    lista.innerHTML = '';
    if (!revision.length) {
      seccion.classList.add('oculto');
      return;
    }

    var insignias = { correcta: 'Correcta', parcial: 'Parcial', incorrecta: 'Incorrecta', sin_respuesta: 'Sin responder' };
    revision.forEach(function (item) {
      var pregunta = preguntaPorNumero(item.numero) || {};
      var tarjeta = crear('div', 'revision-item ' + item.estado);

      var cabecera = crear('div', 'revision-cabecera');
      cabecera.appendChild(crear('span', 'revision-titulo', 'Pregunta ' + (item.posicion || pregunta.posicion || item.numero) + ' · ' + item.tema));
      cabecera.appendChild(crear('span', 'revision-insignia', insignias[item.estado] || ''));
      tarjeta.appendChild(cabecera);
      var cuerpo = crear('div', 'revision-cuerpo');
      tarjeta.appendChild(cuerpo);

      var textoEnunciado = item.enunciado || pregunta.enunciado;
      if (textoEnunciado) {
        var enunciado = crear('div', 'revision-enunciado');
        escribirMat(enunciado, textoEnunciado);
        cuerpo.appendChild(enunciado);
      }
      if (item.grafica) {
        var figura = crear('figure', 'grafica');
        dibujarGrafica(figura, item.grafica);
        cuerpo.appendChild(figura);
      }

      var respuesta = crear('div', 'revision-respuesta');
      respuesta.appendChild(crear('span', 'revision-etiqueta', 'Tu respuesta: '));
      var contenido = crear('span');
      if (!item.respuesta) {
        contenido.textContent = 'No respondiste esta pregunta.';
      } else if (item.tipo === 'numerica' || item.tipo === 'corta') {
        escribirMat(contenido, aLatexEstudiante(item.respuesta));
      } else {
        escribirMat(contenido, fraccionesGrandes(item.respuesta));
      }
      respuesta.appendChild(contenido);
      if (item.confianza) respuesta.appendChild(crear('span', 'texto-suave', ' (confianza: ' + item.confianza + ')'));
      cuerpo.appendChild(respuesta);

      if (item.comentarioError) {

      }

      agregarSolucion(cuerpo, item);

      lista.appendChild(tarjeta);

  }
