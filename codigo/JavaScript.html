<script>
  /* =====================================================================
   *  LÓGICA DEL CLIENTE — QUIZ DE CÁLCULO
   *  El navegador NO conoce las respuestas correctas: solo muestra
   *  preguntas, guarda respuestas temporalmente y llama al servidor.
   *
   *  Funciones del servidor usadas (Código.gs):
   *    obtenerConfiguracionPublica(), iniciarQuiz(datos),
   *    guardarProgreso(intentoId, respuestas, integridad), consultarTutorGuia(datos),
   *    finalizarQuiz(datos), verificarRespuesta(datos), explicarMiError(datos), subirProcedimiento(datos),
   *    eliminarProcedimiento(intentoId, nombre), obtenerPanelDocente(pin), exportarNotasPanel(pin)
   * ===================================================================== */

  // ---------- Estado global de la aplicación ----------
  var estado = {
    config: null,
    intentoId: null,
    nombre: '',
    preguntas: [],
    respuestas: {},        // { "1": "A", "2": {valor, justificacion}, "5": ["A","B"], ... }
    pistas: [],            // pistas usadas por pregunta
    chats: {},             // historial del tutor por pregunta
    actual: 0,             // índice de la pregunta visible
    fin: 0,                // marca de tiempo (ms) en que termina el quiz
    intervalo: null,
    temporizadorGuardado: null,
    enviando: false,
    finalizado: false,
    pidiendoPista: false,
    pistaDesde: 0,
    pistaTimer: null,
    reintentosEnvio: 0,
    maxPistas: 3,
    retroInmediata: false,
    verificadas: {},       // { "3": item de retroalimentación } preguntas ya verificadas (respuesta fija)
    verificando: false,    // número de la pregunta que se está verificando
    integridad: { salidas: 0, segundosFuera: 0, advertencias: 0, copiados: 0, incidentes: [] },
    ocultoDesde: 0,
    ultimoIncidente: 0,    // evita contar dos veces el mismo incidente (ocultar + redimensionar)
    ignorarHasta: 0,       // pausa del control mientras se elige un archivo del procedimiento
    ventanaBase: null,     // tamaño de ventana de referencia para detectar reducciones
    ventanaReducida: false,
    cierreIntegridad: '',
    confianza: {},         // { "3": "Seguro" } nivel de confianza indicado antes de verificar
    practica: false,       // modo práctica: no cuenta para la nota y muestra soluciones
    procedimiento: { habilitado: false, obligatorio: false, maxArchivos: 3, archivos: [] },
    subiendo: false,
    todasPreguntas: [],    // banco completo (6 + extras)
    extrasDesbloqueadas: false  // el estudiante elige las extras al terminar las 6
  };

  var MAX_REINTENTOS_AUTOMATICOS = 3;
  var MAX_REINTENTOS_BLOQUEO = 12;
  var ESPERA_REINTENTO_ENVIO_MS = 10000;
  var FALLOS_PARA_AVISO_CONEXION = 2;
  var PREFIJO_RESPALDO = 'quizMA321_';

  // ---------- Utilidades del DOM ----------
  function $(id) { return document.getElementById(id); }

  function crear(etiqueta, clase, texto) {
    var el = document.createElement(etiqueta);
    if (clase) el.className = clase;
    if (texto !== undefined && texto !== null) el.textContent = texto;
    return el;
  }

  function mostrarPantalla(id) {
    detenerLectura();
    var pantallas = document.querySelectorAll('.pantalla');
    for (var i = 0; i < pantallas.length; i++) pantallas[i].classList.remove('activa');
    $(id).classList.add('activa');
    window.scrollTo(0, 0);
  }

  function mostrarCarga(texto) {
    $('overlay-texto').textContent = texto || 'Procesando…';
    $('overlay-carga').classList.remove('oculto');
  }

  function ocultarCarga() { $('overlay-carga').classList.add('oculto'); }

  function mostrarToast(texto, ms) {
    var t = $('toast');
    t.textContent = texto;
    t.classList.remove('oculto');
    clearTimeout(mostrarToast._id);
    mostrarToast._id = setTimeout(function () { t.classList.add('oculto'); }, ms || 3500);
  }

  /** Modal reutilizable. Si textoCancelar es null, se oculta el botón Cancelar. */
  function abrirModal(titulo, texto, textoAceptar, alAceptar, textoCancelar, alCancelar) {
    $('modal-titulo').textContent = titulo;
    $('modal-texto').textContent = texto;
    $('modal-texto').className = '';
    $('modal-aceptar').textContent = textoAceptar || 'Aceptar';
    var cancelar = $('modal-cancelar');
    if (textoCancelar === null) {
      cancelar.classList.add('oculto');
    } else {
      cancelar.classList.remove('oculto');
      cancelar.textContent = textoCancelar || 'Cancelar';
    }
    cancelar.onclick = function () {
      cerrarModal();
      if (alCancelar) alCancelar();
    };
    $('modal-aceptar').onclick = function () {
      cerrarModal();
      if (alAceptar) alAceptar();
    };
    $('modal').classList.remove('oculto');
    $('modal-aceptar').focus();
  }

  function cerrarModal() { $('modal').classList.add('oculto'); }

  // ---------- Apariencia: modo oscuro, panel del tutor en celular, aviso de guardado ----------
  var CLAVE_TEMA = 'quizMA321_tema';

  // Íconos de línea (24×24) que toman el color del texto.
  var ICONOS = {
    luna: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
    sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    parcial: '<path d="M5 12h14"/>',
    nube: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/><path d="m9 14 2 2 4-4"/>'
  };

  function icono(nombre) {
    var span = document.createElement('span');
    span.className = 'icono-contenedor';
    span.innerHTML = '<svg class="icono" viewBox="0 0 24 24" aria-hidden="true">' + (ICONOS[nombre] || '') + '</svg>';
    return span;
  }

  function aplicarTemaClaro() {
    document.body.classList.remove('oscuro');
    try { localStorage.removeItem(CLAVE_TEMA); } catch (e) { /* sin almacenamiento */ }
  }

  // ---------- Accesibilidad: tamaño de letra y alto contraste ----------
  var CLAVE_LETRA = 'quizMA321_letra';
  var CLAVE_CONTRASTE = 'quizMA321_contraste';
  var NIVELES_LETRA = ['Tamaño de letra normal', 'Letra grande', 'Letra muy grande'];

  function leerPreferencia(clave) {
    try { return localStorage.getItem(clave); } catch (e) { return null; }
  }

  function guardarPreferencia(clave, valor) {
    try { localStorage.setItem(clave, valor); } catch (e) { /* sin almacenamiento */ }
  }

  function aplicarLetra(nivel) {
    nivel = Math.max(0, Math.min(NIVELES_LETRA.length - 1, Number(nivel) || 0));
    var raiz = document.documentElement;
    raiz.classList.remove('letra-1', 'letra-2');
    if (nivel) raiz.classList.add('letra-' + nivel);
    var siguiente = (nivel + 1) % NIVELES_LETRA.length;
    var boton = $('btn-letra');
    boton.title = 'Actual: ' + NIVELES_LETRA[nivel] + '. Clic para: ' + NIVELES_LETRA[siguiente].toLowerCase();
    boton.setAttribute('aria-label', boton.title);
    boton.classList.toggle('activo', nivel > 0);
    return nivel;
  }

  function alternarLetra() {
    var actual = document.documentElement.classList.contains('letra-2') ? 2
      : document.documentElement.classList.contains('letra-1') ? 1 : 0;
    var nivel = aplicarLetra((actual + 1) % NIVELES_LETRA.length);
    guardarPreferencia(CLAVE_LETRA, String(nivel));
    mostrarToast(NIVELES_LETRA[nivel], 1800);
  }

  function aplicarContraste(activo) {
    document.body.classList.toggle('alto-contraste', activo);
    var boton = $('btn-contraste');
    boton.title = activo ? 'Desactivar alto contraste' : 'Activar alto contraste';
    boton.setAttribute('aria-label', boton.title);
    boton.setAttribute('aria-pressed', activo ? 'true' : 'false');
    boton.classList.toggle('activo', activo);
  }

  function alternarContraste() {
    var activo = !document.body.classList.contains('alto-contraste');
    aplicarContraste(activo);
    guardarPreferencia(CLAVE_CONTRASTE, activo ? '1' : '0');
    mostrarToast(activo ? 'Alto contraste activado' : 'Alto contraste desactivado', 1800);
  }

  // ---------- Lectura en voz alta del enunciado ----------
  var NUMEROS_ORDINALES_POTENCIA = { '2': 'al cuadrado', '3': 'al cubo' };

  /** Convierte un fragmento LaTeX en texto que un lector de voz pronuncie en español. */
  function matematicaParaVoz(tex) {
    var t = ' ' + tex + ' ';
    t = t.replace(/\\(displaystyle|left|right|big|Big|quad|qquad)(?![a-zA-Z])/g, ' ')
      .replace(/\\[,;:! ]/g, ' ')
      .replace(/\\[dt]frac/g, '\\frac')
      .replace(/\\mathbb\{R\}/g, ' los números reales ')
      .replace(/\\iff/g, ' si y solo si ')
      .replace(/\\(ge|geq)(?![a-zA-Z])/g, ' mayor o igual que ')
      .replace(/\\(le|leq)(?![a-zA-Z])/g, ' menor o igual que ')
      .replace(/\\ne(?![a-zA-Z])/g, ' distinto de ')
      .replace(/\\pm/g, ' más o menos ')
      .replace(/\\cdot|\\times/g, ' por ')
      .replace(/\\in(?![a-zA-Z])/g, ' en ')
      .replace(/\\ln(?![a-zA-Z])/g, ' logaritmo natural de ')
      .replace(/\\infty/g, ' infinito ');
    var limite = '(\\{(?:[^{}]|\\{[^{}]*\\})*\\}|-?\\w)';
    t = t.replace(new RegExp('\\\\int\\s*_\\s*' + limite + '\\s*\\^\\s*' + limite, 'g'), function (m, a, b) {
      var quitar = function (s) { return s.charAt(0) === '{' ? s.slice(1, -1) : s; };
      return ' la integral desde ' + matematicaParaVoz(quitar(a)) + ' hasta ' + matematicaParaVoz(quitar(b)) + ' de ';
    });
    var antes;
    do {
      antes = t;
      t = t.replace(/\^\{([^{}]*)\}/g, function (m, e) { return ' ' + (NUMEROS_ORDINALES_POTENCIA[e.trim()] || 'elevado a ' + e) + ' '; })
        .replace(/\^(\d)/g, function (m, e) { return ' ' + (NUMEROS_ORDINALES_POTENCIA[e] || 'elevado a ' + e) + ' '; })
        .replace(/\(([^()]*)\)\s*(al cuadrado|al cubo|elevado a)/g, ' la cantidad $1, $2')
        .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, ' $1 sobre $2 ')
        .replace(/\\sqrt\[3\]\{([^{}]*)\}/g, ' raíz cúbica de $1 ')
        .replace(/\\sqrt\{([^{}]*)\}/g, ' raíz cuadrada de $1 ');
      if (t === antes) t = t.replace(/(^|[^}\]a-zA-Z^])\{([^{}]*)\}/g, '$1 $2 ');
    } while (t !== antes);
    t = t.replace(/\\int/g, ' la integral de ')
      .replace(/\^\s*(-?\w)/g, ' elevado a $1 ')
      .replace(/\bd([xtu])\b/g, ', diferencial de $1 ')
      .replace(/([A-Za-z])'\s*\(([^()]*)\)/g, ' $1 prima de $2 ')
      .replace(/\b([fgFGH])\s*\(([^()]*)\)/g, ' $1 de $2 ')
      .replace(/\[([^\[\],]+),([^\[\],]+)\]/g, ' el intervalo de $1 a $2 ')
      .replace(/\|([^|]+)\|/g, ' valor absoluto de $1 ')
      .replace(/\\[a-zA-Z]+/g, ' ')
      .replace(/(\d)\s*([a-z])/g, '$1 $2')
      .replace(/\s-\s?|^-/g, ' menos ')
      .replace(/-/g, ' menos ')
      .replace(/\+/g, ' más ')
      .replace(/=/g, ' igual a ')
      .replace(/</g, ' menor que ')
      .replace(/>/g, ' mayor que ')
      .replace(/[_(){}]/g, ' ');
    return t.replace(/\s+/g, ' ').replace(/\s+,/g, ',').trim();
  }

  /** Enunciado completo (texto y fórmulas) listo para leerse en voz alta. */
  function textoParaVoz(enunciado) {
    var partes = String(enunciado || '').split('$');
    return partes.map(function (p, i) {
      if (i % 2) return ' ' + matematicaParaVoz(p) + ' ';
      return p.replace(/[«»]/g, '"');
    }).join('').replace(/\s+/g, ' ').replace(/\s+([.,;:?])/g, '$1').trim();
  }

  function lecturaDisponible() {
    return typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  }

  function vozEspanol() {
    var voces = window.speechSynthesis.getVoices() || [];
    var preferidas = ['es-CR', 'es-MX', 'es-US', 'es-419', 'es-ES'];
    for (var i = 0; i < preferidas.length; i++) {
      for (var j = 0; j < voces.length; j++) {
        if ((voces[j].lang || '').replace('_', '-').toLowerCase() === preferidas[i].toLowerCase()) return voces[j];
      }
    }
    for (var k = 0; k < voces.length; k++) {
      if (/^es/i.test(voces[k].lang || '')) return voces[k];
    }
    return null;
  }

  function marcarLectura(activa) {
    var boton = $('btn-leer');
    if (!boton) return;
    boton.classList.toggle('leyendo', activa);
    boton.setAttribute('aria-pressed', activa ? 'true' : 'false');
    boton.querySelector('.btn-leer-texto').textContent = activa ? 'Detener' : 'Escuchar';
    boton.title = activa ? 'Detener la lectura' : 'Escuchar el enunciado';
  }

  function detenerLectura() {
    if (lecturaDisponible()) window.speechSynthesis.cancel();
    marcarLectura(false);
  }

  function alternarLectura() {
    if (!lecturaDisponible()) return;
    if ($('btn-leer').classList.contains('leyendo')) { detenerLectura(); return; }
    var p = estado.preguntas && estado.preguntas[estado.actual];
    if (!p) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textoParaVoz(p.enunciado));
    var voz = vozEspanol();
    if (voz) u.voice = voz;
    u.lang = voz ? voz.lang : 'es-ES';
    u.rate = 0.92;
    u.onend = u.onerror = function () { marcarLectura(false); };
    marcarLectura(true);
    window.speechSynthesis.speak(u);
  }

  function abrirTutorMovil(abrir) {
    document.body.classList.toggle('tutor-abierto', abrir);
    if (abrir) setTimeout(function () { $('tutor-chat').scrollTop = $('tutor-chat').scrollHeight; }, 50);
  }

  function mostrarEstadoGuardado(estadoGuardado) {
    var el = $('indicador-guardado');
    var textos = { guardando: 'Guardando…', guardado: 'Guardado', error: 'Sin conexión: guardado en este equipo' };
    el.textContent = '';
    if (estadoGuardado === 'guardado') el.appendChild(icono('nube'));
    el.appendChild(document.createTextNode(textos[estadoGuardado] || ''));
    el.className = 'indicador-guardado ' + (estadoGuardado || '');
    clearTimeout(mostrarEstadoGuardado._id);
    if (estadoGuardado === 'guardado') {
      mostrarEstadoGuardado._id = setTimeout(function () { el.classList.add('desvanecer'); }, 2500);
    }
  }

  /** En respuestas cortas, las fracciones se ven a tamaño completo para que sean legibles. */
  function fraccionesGrandes(texto) {
    return String(texto === null || texto === undefined ? '' : texto).replace(/\\frac(?=\s*\{)/g, '\\dfrac');
  }

  /** Convierte potencias fraccionarias de x y t a radicales antes de usar KaTeX. */
  function potenciasARadicales(texto) {
    var t = String(texto === null || texto === undefined ? '' : texto);
    var convertirDecimal = function (m, base, exponente) {
      var valor = Number(exponente);
      if (!isFinite(valor) || Math.floor(valor) === valor) return m;
      var partes = String(Math.round(valor * 1000000) / 1000000).split('.');
      var den = Math.pow(10, partes[1].length);
      var num = Math.round(valor * den);
      var divisor = function (a, b) { while (b) { var r = a % b; a = b; b = r; } return Math.abs(a) || 1; };
      var d = divisor(Math.abs(num), den);
      num /= d;
      den /= d;
      return potenciaFraccionARadical(base, num, den);
    };
    var convertirFraccion = function (m, base, signo, numerador, denominador) {
      return potenciaFraccionARadical(base, Number(signo === '-' ? -numerador : numerador), Number(denominador));
    };
    t = t.replace(/([xt])\^\{(-?)(\d+)\/(\d+)\}/g, convertirFraccion);
    t = t.replace(/([xt])\^\{(-?\d+\.\d+)\}/g, convertirDecimal);
    return t;
  }

  function potenciaFraccionARadical(base, numerador, denominador) {
    if (!denominador || denominador === 1 || numerador === 0) return base + '^{' + numerador + '}';
    var signo = numerador < 0 ? -1 : 1;
    var n = Math.abs(numerador);
    var radicando = n === 1 ? base : base + '^{' + n + '}';
    var raiz = denominador === 2 ? '\\sqrt{' + radicando + '}' : '\\sqrt[' + denominador + ']{' + radicando + '}';
    return signo < 0 ? '\\dfrac{1}{' + raiz + '}' : raiz;
  }

  function horaActual() {
    var d = new Date();
    return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }

  // ---------- Notación matemática ----------

  /**
   * Escribe en el elemento un texto que puede contener LaTeX entre $...$ o $$...$$.
   * Usa KaTeX si está disponible; si no, muestra una versión en texto plano.
   * El texto normal se inserta como nodo de texto (sin riesgo de inyectar HTML).
   */
  function escribirMat(el, texto) {
    el.innerHTML = '';
    var partes = String(texto === null || texto === undefined ? '' : texto)
      .split(/(\$\$[\s\S]+?\$\$|\$[^$]+?\$)/g);
    partes.forEach(function (parte) {
      if (!parte) return;
      var enBloque = parte.length > 4 && parte.indexOf('$$') === 0 && parte.lastIndexOf('$$') === parte.length - 2;
      var enLinea = !enBloque && parte.length > 2 && parte.charAt(0) === '$' && parte.charAt(parte.length - 1) === '$';
      if (!enBloque && !enLinea) {
        el.appendChild(document.createTextNode(parte));
        return;
      }
      var tex = enBloque ? parte.slice(2, -2) : parte.slice(1, -1);
      tex = potenciasARadicales(fraccionesGrandes(tex));
      var contenedor = document.createElement(enBloque ? 'div' : 'span');
      if (window.katex) {
        try {
          katex.render(tex, contenedor, {
            throwOnError: false,
            displayMode: enBloque,
            macros: {
              '\\sec': '\\operatorname{sec}',
              '\\csc': '\\operatorname{csc}',
              '\\cot': '\\operatorname{cot}'
            }
          });
        } catch (e) {
          contenedor.textContent = latexAPlano(tex);
        }
      } else {
        contenedor.textContent = latexAPlano(tex);
      }
      el.appendChild(contenedor);
    });
  }

  /** Conversión básica de LaTeX a texto (respaldo si KaTeX no carga). */
  function latexAPlano(t) {
    t = t.replace(/\^\{([^{}]*)\}/g, '^($1)').replace(/_\{([^{}]*)\}/g, '_($1)');
    for (var i = 0; i < 3; i++) t = t.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)');
    var mapa = { 'int': '∫', 'cdot': '·', 'pi': 'π', 'infty': '∞', 'in': '∈', 'neq': '≠', 'le': '≤', 'ge': '≥',
      'ln': 'ln', 'left': '', 'right': '', 'displaystyle': '', ',': ' ', ';': ' ', '!': '' };
    return t.replace(/\\([a-zA-Z]+|[,;!])/g, function (m, c) { return mapa.hasOwnProperty(c) ? mapa[c] : c; })
      .replace(/\^\{([^{}]*)\}/g, '^$1').replace(/_\{([^{}]*)\}/g, '_$1').replace(/[{}]/g, '');
  }

  /**
   * Convierte lo que escribe el estudiante (ej. 2x^3/3 - 1/(2x^2)) en LaTeX.
   * Usa la misma precedencia que el evaluador del servidor: ^ antes que * y /,
   * multiplicación implícita igual que *, y todo de izquierda a derecha.
   * Devuelve { ok, tex }; ok=false si la expresión está incompleta.
   */
  function expresionATex(texto) {
    var s = String(texto || '').replace(/[$\\{}]/g, '')
      .replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4')
      .replace(/[−–]/g, '-').replace(/[·×]/g, '*').replace(/÷/g, '/').trim();
    var prefijo = '';
    var m = s.match(/^([A-Za-z])\s*\(\s*x\s*\)\s*=\s*/);
    if (m) {
      prefijo = m[1] + '(x) = ';
      s = s.slice(m[0].length);
    }
    if (!s) return { ok: !!prefijo, tex: prefijo };
    s = s.replace(/√/g, 'sqrt').replace(/π/g, 'pi')
      .replace(/(sqrt|sin|sen|cos|tan|sec|csc|cot|ln|exp|pi)/gi, ' $1 ');
    var tokens = s.match(/\d+(?:[.,]\d+)?|[A-Za-z]+|\S/g) || [];
    var FUNCIONES_TEX = {
      sin: '\\sin', sen: '\\sin', cos: '\\cos', tan: '\\tan', sec: '\\sec',
      csc: '\\csc', cot: '\\cot', ln: '\\ln', exp: '\\exp', sqrt: '\\sqrt'
    };
    var pos = 0;
    var enExponente = 0;
    var ver = function () { return tokens[pos]; };
    var tomar = function () { return tokens[pos++]; };
    var iniciaFactor = function (t) { return t !== undefined && (/^[\dA-Za-z]/.test(t) || t === '('); };
    var interno = function (n) { return n.interno !== undefined ? n.interno : n.tex; };

    function primario() {
      var t = tomar();
      if (t === undefined) throw new Error('incompleta');
      if (/^\d/.test(t)) return { tex: t.replace(',', '{,}').replace('.', '{.}') };
      var nombre = FUNCIONES_TEX[t.toLowerCase()];
      if (nombre) {
        var arg = ver() === '(' ? primario() : potencia();
        return { tex: nombre === '\\sqrt' ? '\\sqrt{' + interno(arg) + '}' : nombre + ' ' + arg.tex };
      }
      if (t.toLowerCase() === 'pi') return { tex: '\\pi' };
      if (/^[A-Za-z]/.test(t)) return { tex: t.length === 1 ? t : '\\mathrm{' + t + '}' };
      if (t === '(') {
        var e = expresion();
        if (tomar() !== ')') throw new Error('incompleta');
        return { tex: '\\left(' + e.tex + '\\right)', interno: e.tex };
      }
      throw new Error('símbolo');
    }
    function potencia() {
      var base = primario();
      if (ver() !== '^') return base;
      tomar();
      enExponente++;
      var exponente = interno(unario());
      enExponente--;
      return { tex: base.tex + '^{' + exponente + '}' };
    }
    function unario() {
      if (ver() === '-') { tomar(); return { tex: '-' + unario().tex }; }
      if (ver() === '+') { tomar(); return unario(); }
      return potencia();
    }
    function termino() {
      var izq = unario();
      for (;;) {
        var t = ver();
        if (t === '*') {
          tomar();
          izq = { tex: izq.tex + ' \\cdot ' + unario().tex };
        } else if (t === '/') {
          tomar();
          var den = unario();
          izq = { tex: enExponente ? izq.tex + '/' + den.tex : '\\dfrac{' + interno(izq) + '}{' + interno(den) + '}' };
        } else if (iniciaFactor(t)) {
          var der = potencia();
          izq = { tex: izq.tex + (/\d\}?$/.test(izq.tex) && /^\d/.test(der.tex) ? ' \\cdot ' : ' ') + der.tex };
        } else {
          return izq;
        }
      }
    }
    function expresion() {
      var izq = termino();
      while (ver() === '+' || ver() === '-') {
        var op = tomar();
        izq = { tex: izq.tex + ' ' + op + ' ' + termino().tex };
      }
      return izq;
    }
    try {
      var r = expresion();
      if (pos < tokens.length) throw new Error('sobrante');
      return { ok: true, tex: prefijo + r.tex };
    } catch (e) {
      return { ok: false, tex: '' };
    }
  }

  /** Texto con notación matemática de lo que escribió el estudiante (o el texto tal cual si está incompleto). */
  function aLatexEstudiante(texto) {
    var limpio = String(texto || '').replace(/\$/g, '').trim();
    if (!limpio) return '';
    var r = expresionATex(limpio);
    return r.ok && r.tex ? '$' + r.tex + '$' : limpio;
  }

  /** Inserta texto en la posición del cursor; "retroceso" deja el cursor dentro de los paréntesis. */
  function insertarEnCampo(input, texto, retroceso) {
    if (input.disabled) return;
    var inicio = input.selectionStart === null ? input.value.length : input.selectionStart;
    var fin = input.selectionEnd === null ? input.value.length : input.selectionEnd;
    var nuevo = input.value.slice(0, inicio) + texto + input.value.slice(fin);
    if (nuevo.length > input.maxLength && input.maxLength > 0) return;
    input.value = nuevo;
    var cursor = inicio + texto.length - (retroceso || 0);
    input.focus();
    try { input.setSelectionRange(cursor, cursor); } catch (e) { /* sin acción */ }
    var evento;
    try { evento = new Event('input', { bubbles: true }); } catch (e) {
      evento = document.createEvent('Event');
      evento.initEvent('input', true, true);
    }
    input.dispatchEvent(evento);
  }

  // ---------- Gráficas (SVG, sin librerías) ----------

  var COLORES_CURVAS = ['#00467f', '#d9480f', '#2b8a3e'];

  /** Evalúa un polinomio con coeficientes del mayor grado al menor. */
  function evaluarPolinomio(coefs, x) {
    return coefs.reduce(function (acum, c) { return acum * x + c; }, 0);
  }

  /** Curva polinómica ({coefs}) o combinación de sin x, cos x, e^x, 1/x y constantes ({terminos: [{f, c}]}). */
  function evaluarCurva(curva, x) {
    if (curva.coefs) return evaluarPolinomio(curva.coefs, x);
    if (curva.puntos) {
      // Curva muestreada en el servidor (áreas creadas por Axioma IA): interpolación lineal.
      var m = curva.puntos, n = m.ys.length - 1;
      var t = (x - m.x0) / (m.x1 - m.x0) * n;
      if (t < 0 || t > n) return NaN;
      var k = Math.min(n - 1, Math.floor(t));
      var y0 = m.ys[k], y1 = m.ys[k + 1];
      if (y0 === null || y1 === null) return NaN;
      return y0 + (y1 - y0) * (t - k);
    }
    return (curva.terminos || []).reduce(function (suma, t) {
      var v = t.f === 'sin' ? Math.sin(x)
        : t.f === 'cos' ? Math.cos(x)
        : t.f === 'exp' ? Math.exp(x)
        : t.f === 'sqrt' ? (x < 0 ? NaN : Math.sqrt(x))
        : t.f === 'inv' ? (Math.abs(x) < 1e-9 ? NaN : 1 / x)
        : 1;
      return suma + (t.c || 0) * v;
    }, 0);
  }

  /** Paso "redondo" (1, 2 o 5 × 10^k) para las marcas de los ejes. */
  function pasoRedondo(rango) {
    var bruto = rango / 8;
    var potencia = Math.pow(10, Math.floor(Math.log(bruto) / Math.LN10));
    var r = bruto / potencia;
    return (r < 1.5 ? 1 : r < 3.5 ? 2 : r < 7.5 ? 5 : 10) * potencia;
  }

  /**
   * Dibuja curvas y región sombreada a partir de la especificación del servidor:
   * { xmin, xmax, ymin, ymax, curvas: [{coefs, etiqueta}], region: {superior, inferior, a, b} }
   * (índice -1 en la región = eje x).
   */
  function dibujarGrafica(contenedor, g) {
    contenedor.innerHTML = '';
    if (!g) { contenedor.classList.add('oculto'); return; }
    contenedor.classList.remove('oculto');

    var W = 440, H = 300, M = 32;
    var NS = 'http://www.w3.org/2000/svg';
    var sx = function (x) { return M + (x - g.xmin) / (g.xmax - g.xmin) * (W - 2 * M); };
    var sy = function (y) { return H - M - (y - g.ymin) / (g.ymax - g.ymin) * (H - 2 * M); };
    var nodo = function (etiqueta, atributos, padre, texto) {
      var el = document.createElementNS(NS, etiqueta);
      for (var k in atributos) el.setAttribute(k, atributos[k]);
      if (texto !== undefined) el.textContent = texto;
      padre.appendChild(el);
      return el;
    };

    var svg = nodo('svg', { viewBox: '0 0 ' + W + ' ' + H, 'class': 'grafica-svg', role: 'img' }, contenedor);
    var idRecorte = 'recorte-' + Math.random().toString(36).slice(2);
    var recorte = nodo('clipPath', { id: idRecorte }, nodo('defs', {}, svg));
    nodo('rect', { x: M, y: M, width: W - 2 * M, height: H - 2 * M }, recorte);

    // Rejilla y marcas
    var ejeX = Math.min(Math.max(sy(0), M), H - M);
    var ejeY = Math.min(Math.max(sx(0), M), W - M);
    if (g.marcasX) {
      g.marcasX.forEach(function (marca) {
        nodo('line', { x1: sx(marca.x), y1: M, x2: sx(marca.x), y2: H - M, 'class': 'g-rejilla' }, svg);
        nodo('text', { x: sx(marca.x), y: ejeX + 14, 'class': 'g-texto', 'text-anchor': 'middle' }, svg, marca.texto);
      });
    } else {
      var px = pasoRedondo(g.xmax - g.xmin) < 1 ? 0.5 : 1;
      for (var x = Math.ceil(g.xmin / px) * px; x <= g.xmax + 1e-9; x += px) {
        nodo('line', { x1: sx(x), y1: M, x2: sx(x), y2: H - M, 'class': 'g-rejilla' }, svg);
        if (Math.abs(x) > 1e-9 && Math.abs(x - Math.round(x)) < 1e-9) {
          nodo('text', { x: sx(x), y: ejeX + 14, 'class': 'g-texto', 'text-anchor': 'middle' }, svg, String(Math.round(x)));
        }
      }
    }
    var py = pasoRedondo(g.ymax - g.ymin);
    for (var y = Math.ceil(g.ymin / py) * py; y <= g.ymax + 1e-9; y += py) {
      nodo('line', { x1: M, y1: sy(y), x2: W - M, y2: sy(y), 'class': 'g-rejilla' }, svg);
      if (Math.abs(y) > 1e-9) {
        nodo('text', { x: ejeY - 5, y: sy(y) + 4, 'class': 'g-texto', 'text-anchor': 'end' }, svg, String(Math.round(y * 100) / 100));
      }
    }

    // Región sombreada
    if (g.region) {
      var r = g.region;
      var curvaA = r.superior >= 0 ? g.curvas[r.superior] : { coefs: [0] };
      var curvaB = r.inferior >= 0 ? g.curvas[r.inferior] : { coefs: [0] };
      // Con "entre", las curvas pueden cruzarse: se sombrea entre la mayor y la menor.
      var arriba = function (t) {
        var p = evaluarCurva(curvaA, t), q = evaluarCurva(curvaB, t);
        return r.entre ? Math.max(p, q) : p;
      };
      var abajo = function (t) {
        var p = evaluarCurva(curvaA, t), q = evaluarCurva(curvaB, t);
        return r.entre ? Math.min(p, q) : q;
      };
      var puntos = [];
      var N = 80, i, xi;
      for (i = 0; i <= N; i++) {
        xi = r.a + (r.b - r.a) * i / N;
        puntos.push(sx(xi).toFixed(1) + ',' + sy(arriba(xi)).toFixed(1));
      }
      for (i = N; i >= 0; i--) {
        xi = r.a + (r.b - r.a) * i / N;
        puntos.push(sx(xi).toFixed(1) + ',' + sy(abajo(xi)).toFixed(1));
      }
      nodo('polygon', { points: puntos.join(' '), 'class': 'g-region', 'clip-path': 'url(#' + idRecorte + ')' }, svg);
    }

    // Ejes
    nodo('line', { x1: M, y1: ejeX, x2: W - M + 8, y2: ejeX, 'class': 'g-eje' }, svg);
    nodo('line', { x1: ejeY, y1: H - M, x2: ejeY, y2: M - 8, 'class': 'g-eje' }, svg);
    nodo('text', { x: W - M + 12, y: ejeX + 4, 'class': 'g-etiqueta-eje' }, svg, 'x');
    nodo('text', { x: ejeY + 6, y: M - 10, 'class': 'g-etiqueta-eje' }, svg, 'y');

    // Curvas
    g.curvas.forEach(function (c, k) {
      var pts = [];
      for (var j = 0; j <= 240; j++) {
        var xc = g.xmin + (g.xmax - g.xmin) * j / 240;
        var yc = evaluarCurva(c, xc);
        if (!isFinite(yc)) continue;
        pts.push(sx(xc).toFixed(1) + ',' + sy(yc).toFixed(1));
      }
      if (!pts.length) return;
      nodo('polyline', {
        points: pts.join(' '), 'class': 'g-curva',
        stroke: COLORES_CURVAS[k % COLORES_CURVAS.length], 'clip-path': 'url(#' + idRecorte + ')'
      }, svg);
    });

    // Leyenda con notación matemática
    var leyenda = crear('div', 'grafica-leyenda');
    g.curvas.forEach(function (c, k) {
      var item = crear('span', 'leyenda-item');
      var color = crear('span', 'leyenda-color');
      color.style.background = COLORES_CURVAS[k % COLORES_CURVAS.length];
      item.appendChild(color);
      var etiqueta = crear('span');
      escribirMat(etiqueta, c.etiqueta);
      item.appendChild(etiqueta);
      leyenda.appendChild(item);
    });
    if (g.region) {
      var itemRegion = crear('span', 'leyenda-item');
      itemRegion.appendChild(crear('span', 'leyenda-region'));
      itemRegion.appendChild(crear('span', null, 'Región'));
      leyenda.appendChild(itemRegion);
    }
    contenedor.appendChild(leyenda);
  }

  // ---------- Respaldo local de respuestas ----------

  function guardarRespaldoLocal() {
    try {
      localStorage.setItem(PREFIJO_RESPALDO + estado.intentoId, JSON.stringify(estado.respuestas));
    } catch (e) { /* almacenamiento no disponible */ }
  }

  function leerRespaldoLocal(intentoId) {
    try {
      var v = localStorage.getItem(PREFIJO_RESPALDO + intentoId);
      return v ? JSON.parse(v) : null;
    } catch (e) {
      return null;
    }
  }

  function borrarRespaldoLocal(intentoId) {
    try { localStorage.removeItem(PREFIJO_RESPALDO + intentoId); } catch (e) { /* sin acción */ }
  }

  // ---------- Un solo dispositivo por intento ----------
  var CLAVE_DISPOSITIVO = 'quizMA321_dispositivo';

  /** Identificador aleatorio de este navegador; se conserva entre recargas. Vacío si no hay almacenamiento. */
  function idDispositivo() {
    if (estado.dispositivo !== undefined) return estado.dispositivo;
    var id = '';
    try {
      id = localStorage.getItem(CLAVE_DISPOSITIVO) || '';
      if (!/^[A-Za-z0-9\-]{8,64}$/.test(id)) {
        var bytes = new Uint8Array(16);
        (window.crypto || window.msCrypto).getRandomValues(bytes);
        id = Array.prototype.map.call(bytes, function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
        localStorage.setItem(CLAVE_DISPOSITIVO, id);
      }
    } catch (e) {
      id = '';
    }
    estado.dispositivo = id;
    return id;
  }

  /** El intento se abrió en otro dispositivo (liberado por el docente): este deja de funcionar. */
  function bloquearPorOtroDispositivo() {
    if (estado.bloqueadoDispositivo) return;
    estado.bloqueadoDispositivo = true;
    estado.finalizado = true;
    clearInterval(estado.intervalo);
    clearInterval(estado.latido);
    clearTimeout(estado.temporizadorGuardado);
    ocultarCarga();
    deshabilitarControles(true);
    abrirModal('El intento continúa en otro dispositivo',
      'Tu docente permitió continuar este intento en otro celular o computadora, así que este dispositivo ya no puede modificarlo ni enviarlo.\n\n' +
      'Tus respuestas guardadas siguen disponibles en el nuevo dispositivo.', 'Entendido', null, null);
  }

  // ---------- Integridad: salidas de la pestaña ----------

  function conexionRecuperada() {
    var visible = !$('indicador-conexion').classList.contains('oculto');
    $('indicador-conexion').classList.add('oculto');
    if (visible && quizEnCurso()) mostrarToast('Conexión recuperada. Tus respuestas se guardan de nuevo en línea.', 3500);
  }

  function quizEnCurso() {
    return !!estado.intentoId && !estado.finalizado && !estado.enviando;
  }

  function cerrarPeriodoFuera() {
    if (estado.ocultoDesde) {
      estado.integridad.segundosFuera += Math.round((Date.now() - estado.ocultoDesde) / 1000);
      estado.ocultoDesde = 0;
    }
  }

  function alCambiarVisibilidad() {
    if (!quizEnCurso()) return;
    if (document.hidden) {
      estado.integridad.salidas++;
      estado.ocultoDesde = Date.now();
      registrarIncidente('Salió de la pestaña o minimizó la ventana');
    } else {
      cerrarPeriodoFuera();
      setTimeout(function () { evaluarVentana(true); }, 700);
      programarGuardado();
    }
  }

  /**
   * Cambiar a otra aplicación (Word, otra ventana, Alt+Tab) no oculta la pestaña: solo le quita el foco.
   * Se espera un momento y se confirma con document.hasFocus() para no contar parpadeos.
   */
  function alPerderFoco() {
    if (!quizEnCurso() || document.hidden) return;
    clearTimeout(alPerderFoco._id);
    alPerderFoco._id = setTimeout(function () {
      if (!quizEnCurso() || document.hidden || document.hasFocus() || Date.now() < estado.ignorarHasta) return;
      estado.fueraDeFoco = true;
      estado.integridad.salidas++;
      if (!estado.ocultoDesde) estado.ocultoDesde = Date.now();
      registrarIncidente('Cambió a otra aplicación o ventana (por ejemplo, Word o el explorador)');
      programarGuardado();
    }, 800);
  }

  function alRecuperarFoco() {
    clearTimeout(alPerderFoco._id);
    if (!estado.fueraDeFoco) return;
    estado.fueraDeFoco = false;
    if (!quizEnCurso()) return;
    cerrarPeriodoFuera();
    programarGuardado();
  }

  /** El control estricto (advertencia y cierre) aplica al quiz y a la práctica IA. */
  function controlVentanaActivo() {
    return !!(estado.config && estado.config.controlVentana) && quizEnCurso();
  }

  function esDispositivoTactil() {
    return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  }

  function medirVentana() {
    return {
      ancho: window.outerWidth || window.innerWidth,
      alto: window.outerHeight || window.innerHeight,
      escala: window.devicePixelRatio || 1
    };
  }

  /** Detecta cuando el estudiante achica la ventana (ej. para ver otra ventana al lado). */
  function alRedimensionar() {
    clearTimeout(alRedimensionar._id);
    alRedimensionar._id = setTimeout(function () { evaluarVentana(true); }, 600);
  }

  /**
   * Compara el tamaño actual con el de referencia. Al pasar de normal a reducida registra
   * un incidente; mientras siga reducida, el quiz queda tapado por la pantalla de bloqueo.
   */
  function evaluarVentana(contarIncidente) {
    if (!controlVentanaActivo() || esDispositivoTactil()) {
      actualizarBloqueoVentana();
      return;
    }
    var v = medirVentana();
    var base = estado.ventanaBase;
    if (!base || v.escala !== base.escala) {
      // Primera medición o cambio de zoom: se toma como nueva referencia.
      estado.ventanaBase = v;
      estado.ventanaReducida = false;
      actualizarBloqueoVentana();
      return;
    }
    if (v.ancho > base.ancho) base.ancho = v.ancho;
    if (v.alto > base.alto) base.alto = v.alto;
    var reducida = v.ancho < base.ancho * 0.8 || v.alto < base.alto * 0.75;
    var nuevaReduccion = reducida && !estado.ventanaReducida;
    estado.ventanaReducida = reducida;
    actualizarBloqueoVentana();
    if (nuevaReduccion && contarIncidente) registrarIncidente('Redujo el tamaño de la ventana');
  }

  function enPantallaCompleta() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  /** Pantalla completa exigida: solo si está activada y el navegador sí permitió activarla al iniciar. */
  function exigePantallaCompleta() {
    return !!(estado.config && estado.config.pantallaCompleta) && !!estado.pantallaCompletaLograda;
  }

  /**
   * Tapa el quiz mientras la ventana siga reducida o fuera de la pantalla completa exigida;
   * se quita sola al volver a la normalidad.
   */
  function actualizarBloqueoVentana() {
    var activo = controlVentanaActivo() && !esDispositivoTactil();
    var faltaPantalla = activo && exigePantallaCompleta() && !enPantallaCompleta();
    var bloquear = activo && (!!estado.ventanaReducida || faltaPantalla);
    if (bloquear) {
      $('bloqueo-titulo').textContent = faltaPantalla ? 'La actividad debe estar en pantalla completa' : 'La ventana está reducida';
      $('bloqueo-texto').textContent = faltaPantalla
        ? 'Saliste de la pantalla completa. Para continuar, presiona el botón de abajo. La actividad está bloqueada y el tiempo sigue corriendo.'
        : 'Para continuar, la ventana debe volver a su tamaño completo. La actividad está bloqueada y el tiempo sigue corriendo.';
    }
    $('bloqueo-ventana').classList.toggle('oculto', !bloquear);
  }

  function salirPantallaCompleta() {
    try {
      if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().then(null, function () {});
      else if (document.webkitExitFullscreen && document.webkitFullscreenElement) document.webkitExitFullscreen();
    } catch (e) { /* sin acción */ }
  }

  /** Pide pantalla completa (solo funciona dentro de un clic del estudiante). */
  function intentarPantallaCompleta() {
    var el = document.documentElement;
    var pedir = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!pedir || document.fullscreenElement || document.webkitFullscreenElement) return;
    try {
      var promesa = pedir.call(el);
      if (promesa && promesa.then) promesa.then(null, function () { /* el navegador no lo permitió */ });
    } catch (e) { /* sin acción */ }
  }

  function alCambiarPantallaCompleta() {
    if (enPantallaCompleta()) {
      estado.pantallaCompletaLograda = true;
    } else if (controlVentanaActivo() && exigePantallaCompleta() && !esDispositivoTactil()) {
      // Salir de la pantalla completa exigida es un incidente (advertencia o cierre).
      registrarIncidente('Salió de la pantalla completa');
    }
    // El cambio de tamaño que provoca la pantalla completa no cuenta como incidente aparte.
    estado.ignorarHasta = Math.max(estado.ignorarHasta, Date.now() + 2000);
    setTimeout(function () { evaluarVentana(false); }, 700);
  }

  /**
   * Primer incidente: advertencia. Al superar el máximo de advertencias, el quiz se cierra
   * y se envía con las respuestas que tenga en ese momento.
   */
  function registrarIncidente(motivo) {
    if (!controlVentanaActivo()) return;
    var ahora = Date.now();
    if (ahora < estado.ignorarHasta || ahora - estado.ultimoIncidente < 2000) return;
    estado.ultimoIncidente = ahora;
    var integ = estado.integridad;
    integ.advertencias = (integ.advertencias || 0) + 1;
    integ.incidentes = (integ.incidentes || []).concat([motivo]).slice(-10);
    var maximo = Math.max(0, Number(estado.config.maxAdvertencias) || 0);

    if (integ.advertencias > maximo) {
      cerrarPorIntegridad(motivo);
      return;
    }
    guardarAhora();
    var restantes = maximo - integ.advertencias;
    abrirModal('Advertencia ' + integ.advertencias + ' de ' + maximo,
      motivo + '.\n\nDurante el quiz NO puedes salir de esta pestaña, cambiar de ventana ni reducir el tamaño de la ventana. ' +
      (restantes > 0
        ? 'Te quedan ' + restantes + ' advertencia(s).'
        : 'Si vuelve a ocurrir, el quiz se cerrará automáticamente y se enviará con las respuestas que tengas en ese momento.') +
      '\n\nEste incidente quedó registrado para tu docente.' +
      (estado.ventanaReducida ? '\n\nAl aceptar, la ventana debe volver a su tamaño completo para continuar.'
        : (exigePantallaCompleta() && !enPantallaCompleta() ? '\n\nAl aceptar, el quiz volverá a pantalla completa.' : '')),
      'Entendido, volver al quiz', function () {
        if (estado.ventanaReducida || exigePantallaCompleta()) intentarPantallaCompleta();
        setTimeout(function () { evaluarVentana(false); }, 700);
      }, null);
  }

  function cerrarPorIntegridad(motivo) {
    if (estado.enviando || estado.finalizado) return;
    estado.cierreIntegridad = motivo + ' (advertencia ' + estado.integridad.advertencias + ')';
    estado.integridad.cierre = estado.cierreIntegridad;
    cerrarModal();
    enviarQuiz(false);
  }

  /** Bloquea copiar, cortar, pegar y el menú contextual dentro del quiz. */
  function alCopiarOPegar(e) {
    if (!quizEnCurso() || !estado.config || !estado.config.bloquearCopiar) return;
    if (!$('pantalla-quiz').contains(e.target)) return;
    e.preventDefault();
    if (e.type === 'contextmenu') return;
    estado.integridad.copiados = (estado.integridad.copiados || 0) + 1;
    mostrarToast(e.type === 'paste' || e.type === 'drop'
      ? 'No se permite pegar texto durante el quiz. El intento quedó registrado.'
      : 'No se permite copiar el contenido del quiz. El intento quedó registrado.', 3500);
    programarGuardado();
  }

  /** Marca de agua con el nombre y el carné del estudiante sobre la pregunta. */
  function aplicarMarcaAgua(nombre, carne) {
    var tarjeta = document.querySelector('.tarjeta-pregunta');
    if (!tarjeta) return;
    if (!estado.config || !estado.config.marcaAgua || !carne) {
      tarjeta.style.backgroundImage = '';
      return;
    }
    var texto = (nombre + ' · ' + carne).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="380" height="190">' +
      '<text x="190" y="105" text-anchor="middle" transform="rotate(-24 190 95)" fill="#00467f" fill-opacity="0.07" ' +
      'font-family="Arial, sans-serif" font-size="15" font-weight="bold">' + texto + '</text></svg>';
    tarjeta.style.backgroundImage = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
    tarjeta.style.backgroundRepeat = 'repeat';
  }

  function textoContador(n) {
    return n + '/300 · Enter envía, Shift+Enter cambia de línea';
  }

  function formatearReloj(segundos) {
    var m = Math.floor(segundos / 60);
    var s = segundos % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  // =====================================================================
  //  INICIALIZACIÓN
  // =====================================================================
  function inicializarApp() {
    aplicarTemaClaro();
    aplicarLetra(leerPreferencia(CLAVE_LETRA));
    aplicarContraste(leerPreferencia(CLAVE_CONTRASTE) === '1');
    $('btn-letra').addEventListener('click', alternarLetra);
    $('btn-contraste').addEventListener('click', alternarContraste);
    $('btn-leer').addEventListener('click', alternarLectura);
    if (lecturaDisponible() && typeof window.speechSynthesis.getVoices === 'function') window.speechSynthesis.getVoices();
    $('btn-tutor-flotante').addEventListener('click', function () { abrirTutorMovil(true); });
    $('btn-tutor-cerrar').addEventListener('click', function () { abrirTutorMovil(false); });
    $('tutor-fondo').addEventListener('click', function () { abrirTutorMovil(false); });
    $('form-inicio').addEventListener('submit', function (e) {
      e.preventDefault();
      confirmarDatosInicio();
    });
    ['nombre', 'correo', 'carne', 'grupo', 'codigo'].forEach(function (campo) {
      $('campo-' + campo).addEventListener('input', function () { limpiarError(campo); });
    });

    document.addEventListener('visibilitychange', alCambiarVisibilidad);
    document.addEventListener('visibilitychange', function () {
      if (!estado.tiempos) return;
      if (document.hidden) {
        acumularTiempo();
        estado.tiempoPausado = true;
      } else {
        estado.tiempoPausado = false;
        estado.tiempoDesde = Date.now();
      }
    });
    window.addEventListener('blur', alPerderFoco);
    window.addEventListener('focus', alRecuperarFoco);
    window.addEventListener('resize', alRedimensionar);
    document.addEventListener('fullscreenchange', alCambiarPantallaCompleta);
    document.addEventListener('webkitfullscreenchange', alCambiarPantallaCompleta);
    $('btn-restaurar-ventana').addEventListener('click', function () {
      intentarPantallaCompleta();
      setTimeout(function () {
        evaluarVentana(false);
        if (exigePantallaCompleta() && !enPantallaCompleta()) {
          mostrarToast('El navegador no permitió activar la pantalla completa. Vuelve a presionar el botón.', 5000);
        } else if (estado.ventanaReducida) {
          mostrarToast('El navegador no permitió agrandarla automáticamente. Maximiza la ventana (doble clic en la barra de título o Windows + ↑).', 6000);
        }
      }, 900);
    });
    ['copy', 'cut', 'paste', 'drop', 'contextmenu'].forEach(function (tipo) {
      document.addEventListener(tipo, alCopiarOPegar);
    });
    // Elegir un archivo del procedimiento puede ocultar la página en celulares: no cuenta como salida.
    $('proc-archivo').addEventListener('click', function () { estado.ignorarHasta = Date.now() + 60000; });
    $('proc-archivo').addEventListener('change', function () { estado.ignorarHasta = Date.now() + 2000; });
    var opcionesConfianza = document.querySelectorAll('.confianza-opcion');
    for (var c = 0; c < opcionesConfianza.length; c++) {
      opcionesConfianza[c].addEventListener('click', function () {
        var p = estado.preguntas[estado.actual];
        if (!p || estado.verificadas[p.numero] || estado.verificando || estado.enviando || estado.finalizado) return;
        estado.confianza[p.numero] = this.getAttribute('data-valor');
        actualizarVerificacion(p);
      });
    }
    window.addEventListener('offline', function () {
      if (quizEnCurso()) $('indicador-conexion').classList.remove('oculto');
    });
    window.addEventListener('online', function () {
      if (estado.envioPendiente) {
        reintentarEnvioPendiente();
        return;
      }
      if (!quizEnCurso()) return;
      conexionRecuperada();
      programarGuardado();
      reintentarVerificacionPendiente();
    });

    $('btn-anterior').addEventListener('click', function () { irAPregunta(estado.actual - 1); });
    $('btn-siguiente').addEventListener('click', function () {
      var p = estado.preguntas[estado.actual];
      if (estado.secuencial && p && estaRespondida(p) && !estaCompleta(p)) {
        confirmarVerificacion();
        return;
      }
      irAPregunta(estado.actual + 1);
    });
    $('btn-finalizar').addEventListener('click', confirmarFinalizar);
    $('btn-pista').addEventListener('click', pedirPista);
    $('btn-verificar').addEventListener('click', confirmarVerificacion);
    $('tutor-mensaje').addEventListener('input', function () {
      $('tutor-caracteres').textContent = textoContador(this.value.length);
      if (estado.preguntas.length) actualizarContadorPistas();
    });
    $('tutor-mensaje').addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.keyCode === 13) && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        pedirPista();
      }
    });
    $('btn-final-accion').addEventListener('click', accionFinal);
    $('btn-refuerzo').addEventListener('click', iniciarRefuerzo);
    $('encuesta-niveles').addEventListener('click', elegirNivelEncuesta);
    $('btn-encuesta').addEventListener('click', enviarEncuesta);
    $('proc-archivo').addEventListener('change', alElegirArchivos);
    var radiosModo = document.querySelectorAll('input[name="modo"]');
    for (var r = 0; r < radiosModo.length; r++) radiosModo[r].addEventListener('change', actualizarModoInicio);
    if (document.body.getAttribute('data-vista') === 'docente') {
      iniciarPanelDocente();
      return;
    }

    // Advertencia al intentar salir con el quiz en curso.
    window.addEventListener('beforeunload', function (e) {
      if (estado.intentoId && !estado.finalizado) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    google.script.run
      .withSuccessHandler(cargarConfiguracion)
      .withFailureHandler(function () {
        $('pantalla-carga').querySelector('p').textContent =
          'No fue posible cargar el quiz. Recarga la página o avisa a tu docente.';
      })
      .obtenerConfiguracionPublica();
  }

    $('inicio-titulo').textContent = cfg.titulo;

    $('instr-verificar').classList.toggle('oculto', !cfg.retroInmediata);
    if (cfg.secuencial) {

        ? 'Verás una pregunta a la vez, en orden. Debes responder y VERIFICAR cada pregunta antes de avanzar; ' +
          'mientras no la verifiques no podrás ir adelante ni atrás. Al final debes tener todas verificadas.'
        : 'Verás una pregunta a la vez, en orden. Debes responder cada pregunta para pasar a la siguiente ' +
          '(puedes regresar a las anteriores) y responder todas para finalizar.';
    }
    if (cfg.controlVentana) {
      var adv = Math.max(0, Number(cfg.maxAdvertencias) || 0);

      $('instr-ventana').appendChild(crear('strong', null, cfg.pantallaCompleta
        ? 'La actividad se abre en pantalla completa: no salgas de ella, ni de la pestaña, ni reduzcas la ventana. '
        : 'No salgas de la pestaña de la actividad ni reduzcas la ventana. '));

        ? 'La primera vez recibirás una advertencia' + (adv > 1 ? ' (hasta ' + adv + ')' : '') +
          '; si vuelve a ocurrir, la actividad se cerrará y se enviará automáticamente con las respuestas que tengas.'
        : 'Si ocurre, la actividad se cerrará y se enviará automáticamente con las respuestas que tengas.'));
    } else {
      $('instr-ventana').textContent = '';
    }
    if (cfg.bloquearCopiar) {
      $('instr-ventana').appendChild(document.createTextNode(' Copiar y pegar está deshabilitado y queda registrado.'));
    }
    $('instr-ventana').parentNode.classList.toggle('oculto', !$('instr-ventana').textContent.trim());

    if (!cfg.grupoObligatorio) {
      $('grupo-marca').textContent = '(opcional)';
      $('grupo-marca').className = 'texto-suave';
    }
    if (!cfg.correoObligatorio) {
      $('correo-marca').textContent = '(opcional)';
      $('correo-marca').className = 'texto-suave';
    }
    $('campo-correo').placeholder = cfg.soloCorreoUcr === false ? 'tu.correo@ejemplo.com' : 'nombre.apellido@' + cfg.dominioCorreo;
    if (cfg.soloCorreoUcr === false) document.querySelector('label[for="campo-correo"]').firstChild.textContent = 'Correo electrónico ';
    if (cfg.correoDetectado) {
      // Correo tomado de la cuenta con la que se abrió la app: no se puede editar.
      $('campo-correo').value = cfg.correoDetectado;
      $('campo-correo').readOnly = true;
    }
    if (cfg.penalizacionPorPista > 0) {
      $('tutor-penalizacion').textContent = 'Cada pista resta ' + cfg.penalizacionPorPista + ' punto(s).';
      $('tutor-penalizacion').classList.remove('oculto');

    document.title = cfg.titulo;

    $('modo-opcion-previa').classList.toggle('oculto', !cfg.practicaPrevia);
    if (cfg.practicaPrevia) {
      $('modo-previa-texto').textContent = cfg.totalPrevia + ' ejercicios distintos a los del quiz (' + cfg.minutosPrevia +
        ' min), con solución paso a paso. No cuenta para la nota ni gasta tu intento.';
    }

    if (cfg.practicaIA) {
      $('modo-axioma-texto').textContent = cfg.ejerciciosPracticaIA + ' preguntas con la misma temática del quiz, incluidos los 2 ejercicios extra, creadas y revisadas por Axioma IA. ' +
        'Mismo formato (verificar, pistas, solución e integridad). Al terminar te llegan a tu correo. No cuenta para la nota.';

    $('selector-modo').classList.toggle('oculto', !cfg.permitirPractica && !cfg.practicaPrevia && !cfg.practicaIA);
